packages:
  - apps/*
  - docs
  - packages/*
  - formats/*
  - platforms/*
  - renderers/*
  - bundlers/*
  - design/*
  - ai/*
  - plugins/pantoken/*
  - plugins/postcss/*
  - plugins/tinymce/*
  - plugins/typedoc/*
  - plugins/vite/*
  - plugins/vitepress/*
  - tools/*

catalogMode: prefer

catalog:
  "@a2ui/web_core": ^0.15.0
  lit: ^3.3.3
  acorn: ^8.19.0
  yaml: ^2.9.1
  "@types/node": ^26.6.6
  typescript: 7.1.0-dev.20261123.1
  arkregex: ^0.0.15
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vite-plus: 1.7.0
  # Upstream Instructure sources. The design-tokens repo is GitHub-only and versioned independently of
  # the 11.7.x line, so it's pinned to a release tag (its package.json version is unreliable — stuck at
  # 1.0.0 across tags — so the tag + resolved commit are the provenance the upgrade pipeline records).
  "@instructure/instructure-design-tokens": "github:instructure/instructure-design-tokens#v2.1.0"
  "@instructure/ui-icons": ^11.7.10
  lucide: ^1.75.0
  # Native token transforms
  style-dictionary: ^5.8.0
  "@tokens-studio/sd-transforms": ^2.0.3
  # Rehype / unist
  unist-util-visit: ^5.2.0
  # Localization-engine offset-splice extraction (see .claude/plans/localization-engine.md)
  unified: ^11.0.5
  remark-parse: ^11.0.0
  # Localization-engine MF2 messages (Phase 3)
  messageformat: ^4.1.0
  # markdown-it integration
  markdown-it: ^15.0.3
  # Brand icons (plugin)
  simple-icons: ^16.38.0
  # Lucide Lab icons (plugin)
  "@lucide/lab": ^0.14.0
  # React markdown integration
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  react-markdown: ^10.1.0
  "@emotion/react": ^11.14.0
  "@emotion/styled": ^11.14.1
  "@mui/material": ^9.5.0
  remark-gfm: ^4.0.1
  postcss: ^8.5.33
  webpack-sources: ^3.7.1
  cheerio: ^1.2.0
  juice: ^12.2.4
  # Icon font chain
  points-on-path: ^0.2.1
  clipper-lib: ^6.4.2
  svgicons2svgfont: ^16.0.0
  svgpath: ^2.6.0
  svg2ttf: ^6.1.0
  ttf2woff2: ^8.0.1
  "@mdx-js/react": ^3.1.1
  "@instructure/ui-heading": ^11.7.10
  "@instructure/ui-text": ^11.7.10
  "@instructure/ui-link": ^11.7.10
  "@instructure/ui-list": ^11.7.10
  "@instructure/ui-table": ^11.7.10
  "@instructure/ui-view": ^11.7.10
  "@instructure/ui-img": ^11.7.10
  "@instructure/ui-alerts": ^11.7.10
  core-js: ^3.51.0
  # Property-based testing
  fast-check: ^4.10.3
  # Codecov bundle analysis plugin
  "@codecov/vite-plugin": ^2.0.1
  # Quality gates
  automatica11y: ^0.12.2
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  "@changesets/cli": ^3.0.3
  "@vitest/coverage-v8": 5.1.1
  markdownlint-cli2: ^0.24.1
  "@manypkg/cli": ^0.25.1
  fallow: ^3.43.2
  happy-dom: ^21.0.4
  dompurify: ^3.4.18
  snyk: ^1.1308.4
  publint: ^0.3.25
  "@arethetypeswrong/cli": ^0.18.5
  bumpp: ^12.3.0
  vitepress-plugin-mermaid: ^2.0.17
  mermaid: ^12.3.0
  shiki: ^4.6.0
  "@shikijs/langs": ^4.6.0
  "@shikijs/themes": ^4.6.0
  "@shikijs/types": ^4.6.0
  vue: ^3.5.45
  "@vue/server-renderer": ^3.5.45
  vitepress: 2.0.0-alpha.21
  oxc-minify: ^0.159.0
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.14.1
  typedoc-vitepress-theme: ^1.1.4
  vitepress-plugin-llms: ^1.15.0
  # CLI framework (commander-based scaffolding CLI rebuild)
  commander: ^15.1.0
  "@commander-js/extra-typings": ^15.1.0
  "@clack/prompts": ^1.9.0
  "@bomb.sh/tab": ^0.0.23
  # @cssdoc/* toolchain — @cssdoc/markdown arrives transitively
  # via @cssdoc/typedoc; the entries below are pantoken's direct dependencies.
  "@cssdoc/cli": ^0.16.2
  "@cssdoc/core": ^0.16.2
  "@cssdoc/config": ^0.16.2
  "@cssdoc/typedoc": ^0.16.2
  # Transitive deps that pantoken also uses directly (the stylelint config); the rest were mirrored
  # only for the linked cssdoc source and are now unused, kept harmless under `catalogMode: prefer`.
  ajv: ^8.20.0
  grammarkdown: ^3.3.2
  stylelint: ^18.0.0
  # Not ESLint deps: oxlint loads these two through its ESLint-compatible JS-plugin bridge.
  eslint-plugin-tsdoc: ^0.5.4
  eslint-plugin-tsdoc-require-2: ^1.2.7
  postcss-value-parser: ^4.2.0
  css-tree: ^3.2.1
  "@types/css-tree": ^3.2.0
  "@resvg/resvg-js": ^2.6.2
  esbuild: ^0.28.2
  changelogen: ^0.6.2
  "@vscode/vsce": ^4.1.1
  ovsx: ^1.4.0
  vscode-languageclient: ^11.0.0
  vscode-languageserver: ^11.0.0
  vscode-languageserver-textdocument: ^1.0.16
  bingo-stratum: ^0.11.1
  zod: ^4.6.7
  # @pantoken/tinymce + canvas-theme-editor scaffold — tracks the current tinymce major, not
  # instructure/canvas-lms's own (older) production RCE version. v8's stricter DOMPurify
  # sanitization is stricter than canvas-lms's tinymce 5, which is an acceptable direction.
  tinymce: ^8.10.2
  tinymce-i18n: 26.11.2
  less: ^4.9.1
  codemirror: ^6.0.2
  "@codemirror/lang-html": ^6.4.12
  "@codemirror/language": ^6.13.1
  "@codemirror/lang-css": ^6.3.1
  "@codemirror/lang-javascript": ^6.2.5
  "@codemirror/lint": ^6.9.8
  "@codemirror/autocomplete": ^6.20.4
  fflate: ^0.8.3
  "@codemirror/state": ^6.7.6
  "@codemirror/view": ^6.43.15
  "@lezer/highlight": ^1.2.5
  vitest: 5.1.1
  # Continuous performance testing through Vitest's native benchmark provider.
  "@codspeed/vitest-plugin": ^6.1.1
  tinybench: ^6.2.4
  ajv-draft-04: ^1.0.0
  rehype: ^13.0.2
  rehype-raw: ^7.0.0
  bootstrap: ^5.3.9
  foundation-sites: ^6.9.0
  sass: ^1.108.2
catalogs:
  a2ui-conformance:
    "@a2ui/angular": 0.14.0
    "@a2ui/react": 0.15.0
    "@a2ui/web_core": 0.15.0
    "@angular/common": 22.2.6
    "@angular/compiler": 22.2.6
    "@angular/core": 22.2.6
    "@angular/platform-browser": 22.2.6
    "@playwright/test": 1.65.1
    rxjs: 7.8.2
    zod: 4.6.7
overrides:
  vite@*: "catalog:"
  # next 16.2.10 (auto-installed as @pantoken/next's optional peer) has 3 High CVEs; 16.2.11 patches
  # them. We can't drop the peer (pnpm auto-installs it), so pin the resolved version to the fix.
  next: "^16.2.11"
  vitest@*: "catalog:"
  # ttf2woff2 (formats/icon-font) pins node-gyp@^11, whose make-fetch-happen→cacache chain resolves
  # to deprecated glob@10.5.0. node-gyp 13 dropped that chain (fetches via undici instead), so
  # override just cleans our own install; it only reaches this monorepo's tree, not downstream
  # consumers who install @pantoken/icon-font directly — overrides aren't inherited from a
  # published dependency's package.json.
  node-gyp: "^13.1.0"
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
minimumReleaseAge: 5
minimumReleaseAgeExclude:
  - automatica11y
  - "@cssdoc/*"
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - tsrs
  - "@tsrs/*"
  - typescript
allowBuilds:
  "@parcel/watcher": false
  core-js: true
  esbuild: true
  sharp: true
  snyk: true
  ttf2woff2: true
permissions:
  automatica11y:
    skills: [automatica11y, automatica11y-runner]
  fallow:
    skills: [fallow, fallow-setup]
skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
