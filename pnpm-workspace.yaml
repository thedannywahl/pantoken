packages:
  - apps/*
  - docs
  - packages/*
  - formats/*
  - platforms/*
  - renderers/*
  - bundlers/*
  - design/*
  - ai/*
  - plugins/pantoken/*
  - plugins/postcss/*
  - plugins/typedoc/*
  - plugins/vite/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^26.4.0
  typescript: ^7.0.2
  arkregex: ^0.0.8
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  # Upstream Instructure sources. The design-tokens repo is GitHub-only and versioned independently of
  # the 11.7.x line, so it's pinned to a release tag (its package.json version is unreliable — stuck at
  # 1.0.0 across tags — so the tag + resolved commit are the provenance the upgrade pipeline records).
  "@instructure/instructure-design-tokens": "github:instructure/instructure-design-tokens#v1.8.0"
  "@instructure/ui-icons": ^11.7.5
  lucide: ^1.23.0
  # Native token transforms
  style-dictionary: ^5.5.2
  "@tokens-studio/sd-transforms": ^2.0.3
  # Rehype / unist
  unist-util-visit: ^5.1.0
  # Localization-engine offset-splice extraction (see .claude/plans/localization-engine.md)
  unified: ^11.0.5
  remark-parse: ^11.0.0
  # markdown-it integration
  markdown-it: ^15.0.1
  # Brand icons (plugin)
  simple-icons: ^16.29.0
  # React markdown integration
  react: ^19.2.8
  react-dom: ^19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.5
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  postcss: ^8.5.26
  # Icon font chain
  points-on-path: ^0.2.1
  clipper-lib: ^6.4.2
  svgicons2svgfont: ^16.0.0
  svgpath: ^2.6.0
  svg2ttf: ^6.1.0
  ttf2woff2: ^8.0.1
  "@mdx-js/react": ^3.1.1
  "@instructure/ui-heading": ^11.7.5
  "@instructure/ui-text": ^11.7.5
  "@instructure/ui-link": ^11.7.5
  "@instructure/ui-list": ^11.7.5
  "@instructure/ui-table": ^11.7.5
  "@instructure/ui-view": ^11.7.5
  "@instructure/ui-img": ^11.7.5
  "@instructure/ui-alerts": ^11.7.5
  core-js: ^3.50.0
  # Property-based testing
  fast-check: ^4.9.0
  # Codecov bundle analysis plugin
  "@codecov/vite-plugin": ^2.0.1
  # Quality gates
  "@commitlint/cli": ^21.2.2
  "@commitlint/config-conventional": ^21.2.2
  "@changesets/cli": ^3.0.1
  "@vitest/coverage-v8": 4.1.11
  markdownlint-cli2: ^0.23.2
  "@manypkg/cli": ^0.25.1
  fallow: ^3.21.0
  happy-dom: ^20.12.0
  snyk: ^1.1307.0
  publint: ^0.3.24
  "@arethetypeswrong/cli": ^0.18.5
  bumpp: ^12.2.1
  vitepress-plugin-mermaid: ^2.0.17
  mermaid: ^11.17.2
  shiki: ^4.4.3
  vue: ^3.5.42
  vitepress: 2.0.0-alpha.19
  oxc-minify: ^0.147.0
  typedoc: ^0.28.20
  typedoc-plugin-markdown: ^4.13.0
  typedoc-vitepress-theme: ^1.1.3
  vitepress-plugin-llms: ^1.13.5
  # CLI framework (commander-based scaffolding CLI rebuild)
  commander: ^15.0.0
  "@commander-js/extra-typings": ^15.0.0
  "@clack/prompts": ^1.7.0
  "@bomb.sh/tab": ^0.0.22
  # @cssdoc/* toolchain — @cssdoc/markdown arrives transitively
  # via @cssdoc/typedoc; the entries below are pantoken's direct dependencies.
  "@cssdoc/core": ^0.14.2
  "@cssdoc/config": ^0.14.2
  "@cssdoc/typedoc": ^0.14.2
  "@cssdoc/stylelint-plugin": ^0.14.2
  "@cssdoc/eslint-plugin": ^0.14.2
  # Transitive deps that pantoken also uses directly (stylelint/eslint configs); the rest were mirrored
  # only for the linked cssdoc source and are now unused, kept harmless under `catalogMode: prefer`.
  ajv: ^8.20.0
  grammarkdown: ^3.3.2
  stylelint: ^17.14.1
  eslint: ^10.9.1
  "@eslint/css": ^1.4.0
  "@typescript-eslint/parser": ^8.69.0
  eslint-plugin-tsdoc: ^0.5.2
  eslint-plugin-tsdoc-require-2: ^1.2.7
  "@html-eslint/parser": ^0.65.0
  postcss-value-parser: ^4.2.0
  css-tree: ^3.2.1
  "@types/css-tree": ^3.2.0
  "@resvg/resvg-js": ^2.6.2
  esbuild: ^0.28.2
  changelogen: ^0.6.2
  "@vscode/vsce": ^3.9.2
  ovsx: ^1.0.2
  vscode-languageclient: ^10.1.0
  vscode-languageserver: ^10.1.0
  vscode-languageserver-textdocument: ^1.0.12
  # Continuous performance testing — the vitest bench harness reported to CodSpeed.
  "@codspeed/vitest-plugin": ^5.7.1
  bingo-stratum: ^0.5.13
  zod: ^4.4.3
  # @pantoken/tinymce + canvas-theme-editor scaffold — tinymce is pinned to the 5.x line to match
  # instructure/canvas-lms's own production RCE version, not the current tinymce major.
  tinymce: ^5.10.9
  codemirror: ^6.0.2
  "@codemirror/lang-html": ^6.4.12
  "@codemirror/lang-css": ^6.3.1
  "@codemirror/lang-javascript": ^6.2.5
  "@codemirror/lint": ^6.9.7
  "@codemirror/autocomplete": ^6.20.3
  "@codemirror/state": ^6.7.2
  "@codemirror/view": ^6.43.10
overrides:
  vite@*: "catalog:"
  # next 16.2.10 (auto-installed as @pantoken/next's optional peer) has 3 High CVEs; 16.2.11 patches
  # them. We can't drop the peer (pnpm auto-installs it), so pin the resolved version to the fix.
  next: "^16.2.11"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAge: 5
minimumReleaseAgeExclude:
  - "@cssdoc/*"
allowBuilds:
  core-js: true
  esbuild: true
  sharp: true
  snyk: true
  ttf2woff2: true
