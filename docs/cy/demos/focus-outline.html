<div class="instui-card">
  <div class="focus-demo">
    <p class="hint">
      Tab through the controls (or click the field) to see the ring. It rides every focusable out of
      the box from <code>base.css</code>; the modifiers recolour it, inset it, or turn off the
      animation.
    </p>

    <section>
      <h4>Default ring (any focusable)</h4>
      <div class="row">
        <button class="instui-button">Button</button>
        <a class="instui-link" href="#focus-demo">Link</a>
        <input class="field" placeholder="Input" />
      </div>
    </section>

    <section>
      <h4>Ring colour</h4>
      <div class="row">
        <button class="instui-button">Info (default)</button>
        <button class="instui-button -color-success -focus-color-success">Success</button>
        <button class="instui-button -color-danger -focus-color-danger">Danger</button>
      </div>
    </section>

    <section>
      <h4>Position and animation</h4>
      <div class="row">
        <button class="instui-button -focus-position-inset">Inset ring</button>
        <button class="instui-button -without-focus-animation">No animation</button>
      </div>
    </section>

    <section>
      <h4>Focus within (reveals on click too)</h4>
      <label class="within -focus-within">
        <span class="lbl">Search</span>
        <input class="field" placeholder="Focus me — the whole box rings" />
      </label>
    </section>
  </div>
</div>
