<div class="instui-card">
  <div class="radio-demo">
    <section>
      <h4>Standard</h4>
      <div class="stack">
        <label class="instui-radio"><input type="radio" name="r" checked /> Option A</label>
        <label class="instui-radio"><input type="radio" name="r" /> Option B</label>
        <label class="instui-radio -size-lg"><input type="radio" name="r2" checked /> Large</label>
        <label class="instui-radio"
          ><input type="radio" name="r3" checked disabled /> Disabled</label
        >
      </div>
    </section>

    <section>
      <h4>Toggle buttons (variant="toggle")</h4>
      <div class="group">
        <label class="instui-radio -variant-toggle"
          ><input type="radio" name="t" checked /> Small</label
        >
        <label class="instui-radio -variant-toggle"><input type="radio" name="t" /> Medium</label>
        <label class="instui-radio -variant-toggle"><input type="radio" name="t" /> Large</label>
      </div>
    </section>

    <section>
      <h4>Toggle context colors</h4>
      <div class="group">
        <label class="instui-radio -variant-toggle -context-success"
          ><input type="radio" name="c1" checked /> Success</label
        >
        <label class="instui-radio -variant-toggle -context-danger"
          ><input type="radio" name="c2" checked /> Danger</label
        >
        <label class="instui-radio -variant-toggle -context-warning"
          ><input type="radio" name="c3" checked /> Warning</label
        >
        <label class="instui-radio -variant-toggle -context-off"
          ><input type="radio" name="c4" checked /> Off</label
        >
      </div>
    </section>
  </div>
</div>
