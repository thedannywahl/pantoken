<div class="instui-card">
  <div class="radio-demo">
    <section>
      <h4>Ստանդարտ</h4>
      <div class="stack">
        <label class="instui-radio"><input type="radio" name="r" checked /> Տարբերակ A</label>
        <label class="instui-radio"><input type="radio" name="r" /> Տարբերակ B</label>
        <label class="instui-radio -size-lg"><input type="radio" name="r2" checked /> Մեծ</label>
        <label class="instui-radio"
          ><input type="radio" name="r3" checked disabled /> Անջատված</label
        >
      </div>
    </section>

    <section>
      <h4>Փոխարկիչ կոճակներ (variant="toggle")</h4>
      <div class="group">
        <label class="instui-radio -variant-toggle"
          ><input type="radio" name="t" checked /> Փոքր</label
        >
        <label class="instui-radio -variant-toggle"><input type="radio" name="t" /> Միջին</label>
        <label class="instui-radio -variant-toggle"><input type="radio" name="t" /> Մեծ</label>
      </div>
    </section>

    <section>
      <h4>Փոխարկիչի կոնտեքստային գույներ</h4>
      <div class="group">
        <label class="instui-radio -variant-toggle -context-success"
          ><input type="radio" name="c1" checked /> Հաջողություն</label
        >
        <label class="instui-radio -variant-toggle -context-danger"
          ><input type="radio" name="c2" checked /> Վտանգ</label
        >
        <label class="instui-radio -variant-toggle -context-warning"
          ><input type="radio" name="c3" checked /> Զգուշացում</label
        >
        <label class="instui-radio -variant-toggle -context-off"
          ><input type="radio" name="c4" checked /> Անջատված</label
        >
      </div>
    </section>
  </div>
</div>
