<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
    <label class="instui-checkbox"><input type="checkbox" checked /> Ստուգված</label>
    <label class="instui-checkbox"><input type="checkbox" /> Չստուգված</label>
    <label class="instui-checkbox"><input type="checkbox" data-indeterminate /> Անորոշ</label>
    <label class="instui-checkbox -size-sm"><input type="checkbox" checked /> Փոքր</label>
    <label class="instui-checkbox -invalid"><input type="checkbox" /> Սխալ վիճակ</label>
    <label class="instui-checkbox"><input type="checkbox" checked disabled /> Անգործունակ</label>
    <label class="instui-checkbox -variant-toggle">
      <input type="checkbox" checked /> Փոխելու անջատիչ
    </label>

    <div style="display: flex; gap: 24px; align-items: flex-start; margin-top: 4px">
      <label class="instui-checkbox -variant-toggle -label-placement-top">
        <input type="checkbox" checked /> Լեյբլ վերևում
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-start">
        <input type="checkbox" /> Լեյբլ սկսման մոտ
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-end">
        <input type="checkbox" checked /> Լեյբլ վերջում
      </label>
    </div>
  </div>
</div>
