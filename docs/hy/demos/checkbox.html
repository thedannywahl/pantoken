<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
    <label class="instui-checkbox"><input type="checkbox" checked /> Նշված</label>
    <label class="instui-checkbox"><input type="checkbox" /> Չնշված</label>
    <label class="instui-checkbox"
      ><input type="checkbox" data-indeterminate /> Անորոշ</label
    >
    <label class="instui-checkbox -size-sm"><input type="checkbox" checked /> Փոքր</label>
    <label class="instui-checkbox -invalid"><input type="checkbox" /> Սխալի վիճակ</label>
    <label class="instui-checkbox"><input type="checkbox" checked disabled /> Անջատված</label>
    <label class="instui-checkbox -variant-toggle">
      <input type="checkbox" checked /> Փոխարկիչ
    </label>

    <div style="display: flex; gap: 24px; align-items: flex-start; margin-top: 4px">
      <label class="instui-checkbox -variant-toggle -label-placement-top">
        <input type="checkbox" checked /> Պիտակը վերևում
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-start">
        <input type="checkbox" /> Պիտակը սկզբում
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-end">
        <input type="checkbox" checked /> Պիտակը վերջում
      </label>
    </div>
  </div>
</div>

<script>
  // The mixed state is a DOM property, not an attribute, so set it in script.
  document.querySelectorAll("[data-indeterminate]").forEach((el) => (el.indeterminate = true));
</script>
