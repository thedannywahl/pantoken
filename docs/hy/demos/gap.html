<div class="instui-card">
  <h2 class="instui-heading -level-h3">Բար</h2>
  <p class="instui-text">
    Ֆլեքս/գրիդ
    <code>gap</code> դաշտեր տարածության սանդղակի վրա, կարճ (<code>--gap-sm</code>) կամ երկար
    (<code>--gap-small</code>) ձեռնարկային գրելակերպ — օգտագործելի մերկ կամ շարակցված ցանկացած
    կոմպոնենտի վրա։
  </p>
  <div class="--display-flex --gap-sm">
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">gap-sm</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">Մեկ</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">Երկու</span>
    </div>
  </div>

  <h3 class="instui-heading -level-h5 --mt-lg">Երկար գրելակերպ</h3>
  <div class="--display-flex --gap-large">
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">gap-large</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">Մեկ</span>
    </div>
  </div>
</div>
