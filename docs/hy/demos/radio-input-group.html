<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 28px">
    <!-- Toggle variant: the buttons connect into ONE segmented, single-select control (shared name) -->
    <fieldset class="instui-radio-input-group -variant-toggle">
      <legend>T-shirt չափս</legend>
      <label class="instui-radio -variant-toggle">
        <input type="radio" name="size" checked /> Փոքր
      </label>
      <label class="instui-radio -variant-toggle">
        <input type="radio" name="size" /> Միջին
      </label>
      <label class="instui-radio -variant-toggle"> <input type="radio" name="size" /> Մեծ </label>
    </fieldset>

    <!-- Simple variant (default): standard radios, stacked -->
    <fieldset class="instui-radio-input-group">
      <legend>Ծանուցումների հաճախականություն</legend>
      <label class="instui-radio"><input type="radio" name="freq" checked /> Իրական ժամանակում</label>
      <label class="instui-radio"><input type="radio" name="freq" /> Օրական ամփոփագիր</label>
      <label class="instui-radio"><input type="radio" name="freq" /> Շաբաթական ամփոփագիր</label>
    </fieldset>

    <!-- Simple variant, laid out in a row -->
    <fieldset class="instui-radio-input-group -layout-columns">
      <legend>Կապի եղանակ</legend>
      <label class="instui-radio"><input type="radio" name="contact" checked /> Էլ. փոստ</label>
      <label class="instui-radio"><input type="radio" name="contact" /> Հեռախոս</label>
      <label class="instui-radio"><input type="radio" name="contact" /> Փոստ</label>
    </fieldset>
  </div>
</div>
