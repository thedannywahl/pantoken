<div class="instui-card">
  <!-- A tray as a native [popover]: it docks to an edge and opens in the top layer. -->
  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <button class="instui-button -color-secondary" popovertarget="tray-start">Սկզբից</button>
    <button class="instui-button -color-secondary" popovertarget="tray-end">Վերջից</button>
  </div>

  <div id="tray-start" popover class="instui-tray -size-sm">
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      "
    >
      <strong>Զտիչներ</strong>
      <button
        class="instui-close-button"
        popovertarget="tray-start"
        popovertargetaction="hide"
        aria-label="Close"
      ></button>
    </div>
    <p class="instui-text -size-sm">
      Վահանակը սահում է սկզբնական եզրից և լրացնում դիտման դաշտի բարձրությունը:
    </p>
  </div>

  <div id="tray-end" popover class="instui-tray -placement-end -size-sm">
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      "
    >
      <strong>Մանրամասներ</strong>
      <button
        class="instui-close-button"
        popovertarget="tray-end"
        popovertargetaction="hide"
        aria-label="Close"
      ></button>
    </div>
    <p class="instui-text -size-sm">
      Սա ամրանում է վերջնական եզրին: Սեղմեք Esc կամ կտտացրեք կողքին՝ փակելու համար:
    </p>
  </div>
</div>
