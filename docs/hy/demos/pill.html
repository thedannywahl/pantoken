<div class="instui-card">
  <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap">
    <span class="instui-pill">Սևագիր</span>
    <span class="instui-pill -color-info">Շրջանառության մեջ</span>
    <!-- Flat form: a glyph class on the pill renders the icon before the label. -->
    <span class="instui-pill -color-success -icon-check">Հրապարակված</span>
    <span class="instui-pill -color-warning">Հնացած</span>
    <span class="instui-pill -color-danger">Պասիվացված</span>
  </div>
</div>
