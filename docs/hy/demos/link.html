<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-start">
    <a class="instui-link" href="#">Ստիլավորված հղում</a>
    <a class="instui-link -size-lg" href="#">Մեծ հղում</a>

    <!-- iconPlacement is just DOM order: an .instui-icon child before or after the text. -->
    <a class="instui-link" href="#">
      <span class="instui-icon -icon-download"></span>
      Պոչում սիմվոլը
    </a>
    <a class="instui-link" href="#">
      Վերջում իկոնա
      <span class="instui-icon -icon-arrow-right"></span>
    </a>

    <p class="instui-text">
      Պատրաստվում է կարդալ
      <a class="instui-link -inline" href="#">ներկիր-տող (inline) փաստաթղթավորումը</a> ամբողջ
      պատմության համար։
    </p>

    <a class="instui-link -unstyled" href="#">Չստիլավորված հղում</a>
  </div>

  <!-- color="link-inverse": for links on a dark surface. -->
  <div
    style="
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      background: var(--instui-color-background-inverse);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    "
  >
    <a class="instui-link -color-inverse" href="#">Հղում մուգ ֆոնի վրա</a>
    <a class="instui-link -color-inverse" href="#">
      <span class="instui-icon -icon-external-link"></span>
      Առաջին իկոնայով
    </a>
  </div>
</div>
