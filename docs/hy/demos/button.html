<div class="instui-card">
  <div class="button-demo">
    <section>
      <h4>Գույներ</h4>
      <div class="row">
        <button class="instui-button">Հիմնական</button>
        <button class="instui-button -color-secondary">Երկրորդական</button>
        <button class="instui-button -color-tertiary">Երրորդական</button>
        <button class="instui-button -color-success">Հաջողություն</button>
        <button class="instui-button -color-danger">Վտանգ</button>
      </div>
    </section>

    <section>
      <h4>AI</h4>
      <div class="row">
        <button class="instui-button -color-ai">AI հիմնական</button>
        <button class="instui-button -color-ai-secondary">AI երկրորդական</button>
      </div>
    </section>

    <section>
      <h4>Հիմնական հակադարձ (գունավոր մակերեսի վրա)</h4>
      <div class="row on-brand">
        <button class="instui-button -color-primary-inverse">Հիմնական հակադարձ</button>
      </div>
    </section>

    <section>
      <h4>Ghost (առանց ֆոնի)</h4>
      <div class="row">
        <button class="instui-button -without-background">Հիմնական ghost</button>
        <button class="instui-button -color-secondary -without-background">
          Երկրորդական ghost
        </button>
      </div>
    </section>

    <section>
      <h4>Բլոկ (ամբողջ լայնությամբ)</h4>
      <button class="instui-button -display-block">Բլոկային կոճակ</button>
    </section>

    <section>
      <h4>Չափսեր</h4>
      <div class="row">
        <button class="instui-button -size-sm">Փոքր</button>
        <button class="instui-button">Միջին</button>
        <button class="instui-button -size-lg">Մեծ</button>
      </div>
    </section>

    <section>
      <h4>Պատկերակներ և ձևեր</h4>
      <div class="row">
        <button class="instui-button">
          Շարունակել
          <span class="instui-icon -icon-arrow-right"></span>
        </button>
        <button class="instui-button -color-secondary">
          <span class="instui-icon -icon-download"></span>
          Ներբեռնել
        </button>
        <button class="instui-button -color-secondary" id="star" aria-pressed="false">
          <span class="instui-icon -icon-star"></span>
          <span id="star-label">Աստղ</span>
        </button>
        <!-- Icon-only: the glyph rides the button; name it with aria-label… -->
        <button class="instui-button -shape-square -icon-arrow-right" aria-label="Next"></button>
        <!-- …or with visually-hidden text (use one, not both). -->
        <button class="instui-button -shape-circle -icon-plus">
          <span class="instui-screen-reader-content">Ավելացնել</span>
        </button>
      </div>
    </section>

    <section>
      <h4>Սեղմված և վիճակներ</h4>
      <div class="row">
        <button class="instui-button -condensed">Սեղմված</button>
        <button class="instui-button -condensed -size-sm">Սեղմված փոքր</button>
        <button class="instui-button -toggle" id="toggle" aria-pressed="false">Փոխարկիչ</button>
        <button class="instui-button" disabled>Անջատված</button>
      </div>
    </section>
  </div>
</div>

<style>
  .button-demo {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .button-demo .row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  /*
   * primary-inverse is meant for dark/brand surfaces, so pin this swatch to the brand colour's
   * light-scheme (dark navy) value in both site modes — otherwise the surface flips light in dark
   * mode and the white button disappears.
   */
  .button-demo .on-brand {
    color-scheme: light;
    padding: 12px;
    border-radius: var(--instui-border-radius-md, 6px);
    background: var(--instui-color-background-brand, #0770a3);
  }
</style>

<script>
  const star = document.getElementById("star");
  const starLabel = document.getElementById("star-label");
  let starred = false;
  star.addEventListener("click", () => {
    starred = !starred;
    starLabel.textContent = starred ? "Starred" : "Star";
    star.setAttribute("aria-pressed", String(starred));
  });

  const toggle = document.getElementById("toggle");
  toggle.addEventListener("click", () => {
    toggle.setAttribute(
      "aria-pressed",
      toggle.getAttribute("aria-pressed") === "true" ? "false" : "true",
    );
  });
</script>
