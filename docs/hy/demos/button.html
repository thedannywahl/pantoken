<div class="instui-card">
  <div class="button-demo">
    <section>
      <h4>Գույներ</h4>
      <div class="row">
        <button class="instui-button">Առաջնային</button>
        <button class="instui-button -color-secondary">Երկրորդական</button>
        <button class="instui-button -color-tertiary">Արտաքին</button>
        <button class="instui-button -color-success">Ցանկացած հաջողություն</button>
        <button class="instui-button -color-danger">Վտանգ</button>
      </div>
    </section>

    <section>
      <h4>AI</h4>
      <div class="row">
        <button class="instui-button -color-ai">AI առաջնային</button>
        <button class="instui-button -color-ai-secondary">AI երկրորդական</button>
      </div>
    </section>

    <section>
      <h4>On Color (text on colored background)</h4>
      <div class="row on-brand">
        <button class="instui-button -color-primary-inverse">Առաջնային հակադարձ</button>
        <button class="instui-button -color-primary -on-color">Primary on-color</button>
        <button class="instui-button -color-secondary -on-color">Secondary on-color</button>
      </div>
    </section>

    <section>
      <h4>Անտեսանելի (առանց ֆոն)</h4>
      <div class="row">
        <button class="instui-button -without-background">Առաջնային գոստ</button>
        <button class="instui-button -color-secondary -without-background">Երկրորդական գոստ</button>
      </div>
    </section>

    <section>
      <h4>Բլոկ (լրիվ լայնություն)</h4>
      <button class="instui-button -display-block">Բլոկ կոճակ</button>
    </section>

    <section>
      <h4>Չափեր</h4>
      <div class="row">
        <button class="instui-button -size-sm">Փոքր</button>
        <button class="instui-button">Միջին</button>
        <button class="instui-button -size-lg">Երկար</button>
      </div>
    </section>

    <section>
      <h4>Նշաններ և ձևեր</h4>
      <div class="row">
        <button class="instui-button">
          Շարունակել
          <span class="instui-icon -icon-arrow-right"></span>
        </button>
        <button class="instui-button -color-secondary">
          <span class="instui-icon -icon-download"></span>
          Ներբեռնել
        </button>
        <button class="instui-button -color-secondary" id="star" aria-pressed="false">
          <span class="instui-icon -icon-star"></span>
          <span id="star-label">Աստղ</span>
        </button>
        <!-- Icon-only: the glyph rides the button; name it with aria-label… -->
        <button class="instui-button -shape-square -icon-arrow-right" aria-label="Next"></button>
        <!-- …or with visually-hidden text (use one, not both). -->
        <button class="instui-button -shape-circle -icon-plus">
          <span class="instui-screen-reader-content">Ավելացնել</span>
        </button>
      </div>
    </section>

    <section>
      <h4>Համառոտ և վիճակներ</h4>
      <div class="row">
        <button class="instui-button -condensed">Համառոտ</button>
        <button class="instui-button -condensed -size-sm">Համառոտ փոքր</button>
        <button class="instui-button -toggle" id="toggle" aria-pressed="false">Ընտրիչ</button>
        <button class="instui-button" disabled>Անգործունակ</button>
      </div>
    </section>
  </div>
</div>
