<div class="instui-card" style="height: 20rem; overflow: hidden">
  <!-- Drawer layout is a CSS surface; the interactions bundle adds command routing and overlay-state toggling. -->
  <div style="display: flex; gap: 8px; margin-bottom: 12px">
    <button class="instui-button -color-secondary" command="--toggle" commandfor="demo-drawer">
      Փոխել վահանակը
    </button>
    <button class="instui-button -color-secondary" command="--open" commandfor="demo-drawer">
      Բացել
    </button>
    <button class="instui-button -color-secondary" command="--close" commandfor="demo-drawer">
      Փակել
    </button>
  </div>

  <div
    id="demo-drawer"
    class="instui-drawer-layout"
    open
    style="height: calc(100% - 48px); --drawer-layout-min-width: 36rem"
  >
    <aside class="tray">
      <div style="padding: 12px">
        <strong>Նավիգացիա</strong>
        <ul class="instui-list" style="margin-top: 8px">
          <li class="item">Ընդհանուր տեսք</li>
          <li class="item">Մոդուլներ</li>
          <li class="item">Կարգավորումներ</li>
        </ul>
      </div>
    </aside>
    <main class="content" role="region">
      <div style="padding: 16px">
        <h3 class="instui-heading -level-h3">Հիմնական բովանդակություն</h3>
        <p class="instui-text -size-sm">
          Օգտվեք վերևի կոճակներից՝ բաց/փակ վիճակը փոխելու համար։ Թափանցիկ դիտասահման է արագանում՝
          նեղացրեք պատուհանը՝ տեսնելու համար թե ինչպես տուփը անցնում է վերապատասխանի ռեժիմ։
        </p>
      </div>
    </main>
  </div>
</div>
