<div class="instui-card">
  <div class="typography-demo">
    <section>
      <h4>Text sizes</h4>
      <div class="stack">
        <span class="instui-text -size-xs">x-small text</span>
        <span class="instui-text -size-sm">small text</span>
        <span class="instui-text">medium text (default)</span>
        <span class="instui-text -size-lg">large text</span>
        <span class="instui-text -size-xl">x-large text</span>
      </div>
    </section>

    <section>
      <h4>Text weight, style, and color</h4>
      <div class="stack">
        <span class="instui-text -weight-bold">Bold</span>
        <span class="instui-text -style-italic">Italic</span>
        <span class="instui-text -color-brand">Brand</span>
        <span class="instui-text -color-success">Success</span>
        <span class="instui-text -color-danger">Danger</span>
        <span class="instui-text -color-warning">Warning</span>
        <span class="instui-text -weight-bold -color-danger">Bold danger (stacked)</span>
        <span class="instui-text -color-secondary">Secondary</span>
      </div>
    </section>

    <section>
      <h4>Text content variants</h4>
      <div class="stack">
        <span class="instui-text -variant-description-page">Beskrivning page</span>
        <span class="instui-text -variant-description-section">Beskrivning section</span>
        <span class="instui-text -variant-content-small">Content small</span>
        <span class="instui-text -variant-legend">Legend</span>
      </div>
    </section>
  </div>
</div>
