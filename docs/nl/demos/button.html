<div class="instui-card">
  <div class="button-demo">
    <section>
      <h4>Kleuren</h4>
      <div class="row">
        <button class="instui-button">Primair</button>
        <button class="instui-button -color-secondary">Secundair</button>
        <button class="instui-button -color-tertiary">Tertiair</button>
        <button class="instui-button -color-success">Succes</button>
        <button class="instui-button -color-danger">Gevaar</button>
      </div>
    </section>

    <section>
      <h4>AI</h4>
      <div class="row">
        <button class="instui-button -color-ai">AI primair</button>
        <button class="instui-button -color-ai-secondary">AI secundair</button>
      </div>
    </section>

    <section>
      <h4>Primair geïnverteerd (op een gekleurd oppervlak)</h4>
      <div class="row on-brand">
        <button class="instui-button -color-primary-inverse">Primair geïnverteerd</button>
      </div>
    </section>

    <section>
      <h4>Ghost (geen achtergrond)</h4>
      <div class="row">
        <button class="instui-button -without-background">Primair ghost</button>
        <button class="instui-button -color-secondary -without-background">Secundair ghost</button>
      </div>
    </section>

    <section>
      <h4>Blok (volledige breedte)</h4>
      <button class="instui-button -display-block">Blokknop</button>
    </section>

    <section>
      <h4>Maten</h4>
      <div class="row">
        <button class="instui-button -size-sm">Klein</button>
        <button class="instui-button">Medium</button>
        <button class="instui-button -size-lg">Groot</button>
      </div>
    </section>

    <section>
      <h4>Pictogrammen en vormen</h4>
      <div class="row">
        <button class="instui-button">
          Doorgaan
          <span class="instui-icon -icon-arrow-right"></span>
        </button>
        <button class="instui-button -color-secondary">
          <span class="instui-icon -icon-download"></span>
          Downloaden
        </button>
        <button class="instui-button -color-secondary" id="star" aria-pressed="false">
          <span class="instui-icon -icon-star"></span>
          <span id="star-label">Ster</span>
        </button>
        <!-- Icon-only: the glyph rides the button; name it with aria-label… -->
        <button class="instui-button -shape-square -icon-arrow-right" aria-label="Next"></button>
        <!-- …or with visually-hidden text (use one, not both). -->
        <button class="instui-button -shape-circle -icon-plus">
          <span class="instui-screen-reader-content">Toevoegen</span>
        </button>
      </div>
    </section>

    <section>
      <h4>Compact en statussen</h4>
      <div class="row">
        <button class="instui-button -condensed">Compact</button>
        <button class="instui-button -condensed -size-sm">Compact klein</button>
        <button class="instui-button -toggle" id="toggle" aria-pressed="false">Schakelaar</button>
        <button class="instui-button" disabled>Uitgeschakeld</button>
      </div>
    </section>
  </div>
</div>

<style>
  .button-demo {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .button-demo .row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  /*
   * primary-inverse is meant for dark/brand surfaces, so pin this swatch to the brand colour's
   * light-scheme (dark navy) value in both site modes — otherwise the surface flips light in dark
   * mode and the white button disappears.
   */
  .button-demo .on-brand {
    color-scheme: light;
    padding: 12px;
    border-radius: var(--instui-border-radius-md, 6px);
    background: var(--instui-color-background-brand, #0770a3);
  }
</style>

<script>
  const star = document.getElementById("star");
  const starLabel = document.getElementById("star-label");
  let starred = false;
  star.addEventListener("click", () => {
    starred = !starred;
    starLabel.textContent = starred ? "Starred" : "Star";
    star.setAttribute("aria-pressed", String(starred));
  });

  const toggle = document.getElementById("toggle");
  toggle.addEventListener("click", () => {
    toggle.setAttribute(
      "aria-pressed",
      toggle.getAttribute("aria-pressed") === "true" ? "false" : "true",
    );
  });
</script>
