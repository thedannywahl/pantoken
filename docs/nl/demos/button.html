<div class="instui-card">
  <div class="button-demo">
    <section>
      <h4>Kleuren</h4>
      <div class="row">
        <button class="instui-button">Primair</button>
        <button class="instui-button -color-secondary">Secundair</button>
        <button class="instui-button -color-tertiary">Tertiair</button>
        <button class="instui-button -color-success">Succes</button>
        <button class="instui-button -color-danger">Gevaar</button>
      </div>
    </section>

    <section>
      <h4>AI</h4>
      <div class="row">
        <button class="instui-button -color-ai">AI primair</button>
        <button class="instui-button -color-ai-secondary">AI secundair</button>
      </div>
    </section>

    <section>
      <h4>On Color (text on colored background)</h4>
      <div class="row on-brand">
        <button class="instui-button -color-primary-inverse">Primaire inverse</button>
        <button class="instui-button -color-primary -on-color">Primary on-color</button>
        <button class="instui-button -color-secondary -on-color">Secondary on-color</button>
      </div>
    </section>

    <section>
      <h4>Ghost (geen achtergrond)</h4>
      <div class="row">
        <button class="instui-button -without-background">Primaire ghost</button>
        <button class="instui-button -color-secondary -without-background">Secundaire ghost</button>
      </div>
    </section>

    <section>
      <h4>Blok (volledige breedte)</h4>
      <button class="instui-button -display-block">Blokknop</button>
    </section>

    <section>
      <h4>Maten</h4>
      <div class="row">
        <button class="instui-button -size-sm">Klein</button>
        <button class="instui-button">Medium</button>
        <button class="instui-button -size-lg">Groot</button>
      </div>
    </section>

    <section>
      <h4>Pictogrammen en vormen</h4>
      <div class="row">
        <button class="instui-button">
          Doorgaan
          <span class="instui-icon -icon-arrow-right"></span>
        </button>
        <button class="instui-button -color-secondary">
          <span class="instui-icon -icon-download"></span>
          Downloaden
        </button>
        <button class="instui-button -color-secondary" id="star" aria-pressed="false">
          <span class="instui-icon -icon-star"></span>
          <span id="star-label">Ster</span>
        </button>
        <!-- Icon-only: the glyph rides the button; name it with aria-label… -->
        <button class="instui-button -shape-square -icon-arrow-right" aria-label="Next"></button>
        <!-- …or with visually-hidden text (use one, not both). -->
        <button class="instui-button -shape-circle -icon-plus">
          <span class="instui-screen-reader-content">Toevoegen</span>
        </button>
      </div>
    </section>

    <section>
      <h4>Ingeklemd en staten</h4>
      <div class="row">
        <button class="instui-button -condensed">Ingeklemd</button>
        <button class="instui-button -condensed -size-sm">Ingeklemd klein</button>
        <button class="instui-button -toggle" id="toggle" aria-pressed="false">Schakelaar</button>
        <button class="instui-button" disabled>Uitgeschakeld</button>
      </div>
    </section>
  </div>
</div>
