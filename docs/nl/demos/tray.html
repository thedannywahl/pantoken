<div class="instui-card">
  <!-- A tray as a native [popover]: it docks to an edge and opens in the top layer. -->
  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <button class="instui-button -color-secondary" popovertarget="tray-start">Vanaf start</button>
    <button class="instui-button -color-secondary" popovertarget="tray-end">Vanaf einde</button>
  </div>

  <div id="tray-start" popover class="instui-tray -size-sm">
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      "
    >
      <strong>Filters</strong>
      <button
        class="instui-close-button"
        popovertarget="tray-start"
        popovertargetaction="hide"
        aria-label="Close"
      ></button>
    </div>
    <p class="instui-text -size-sm">
      Een lade schuift in vanaf de startkant en vult de hoogte van het viewport.
    </p>
  </div>

  <div id="tray-end" popover class="instui-tray -placement-end -size-sm">
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      "
    >
      <strong>Details</strong>
      <button
        class="instui-close-button"
        popovertarget="tray-end"
        popovertargetaction="hide"
        aria-label="Close"
      ></button>
    </div>
    <p class="instui-text -size-sm">
      Deze dockt aan de eindkant. Druk op Esc of klik buiten om te sluiten.
    </p>
  </div>
</div>
