<div class="instui-card">
  <h2 class="instui-heading -level-h3">Tussenruimte</h2>
  <p class="instui-text">
    Flex/grid <code>gap</code>-klassen op de afstandsschaal, korte (<code>--gap-sm</code>) of lange
    (<code>--gap-small</code>) schrijfwijze — los te gebruiken of gekoppeld aan elk component.
  </p>
  <div class="--display-flex --gap-sm">
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">gap-sm</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">Een</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">Twee</span>
    </div>
  </div>

  <h3 class="instui-heading -level-h5 --mt-lg">Lange schrijfwijze</h3>
  <div class="--display-flex --gap-large">
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">gap-large</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">Een</span>
    </div>
  </div>
</div>
