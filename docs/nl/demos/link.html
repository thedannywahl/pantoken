<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-start">
    <a class="instui-link" href="#">Een opgemaakte link</a>
    <a class="instui-link -size-lg" href="#">Een grote link</a>

    <!-- iconPlacement is just DOM order: an .instui-icon child before or after the text. -->
    <a class="instui-link" href="#">
      <span class="instui-icon -icon-download"></span>
      Icoon aan het begin
    </a>
    <a class="instui-link" href="#">
      Icoon aan het einde
      <span class="instui-icon -icon-arrow-right"></span>
    </a>

    <p class="instui-text">
      Lees de <a class="instui-link -inline" href="#">inline documentatie</a> voor het volledige verhaal.
    </p>

    <a class="instui-link -unstyled" href="#">Niet-opgemaakte link</a>
  </div>

  <!-- color="link-inverse": for links on a dark surface. -->
  <div
    style="
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      background: var(--instui-color-background-inverse);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    "
  >
    <a class="instui-link -color-inverse" href="#">Een link op een donkere achtergrond</a>
    <a class="instui-link -color-inverse" href="#">
      <span class="instui-icon -icon-external-link"></span>
      Met een voorafgaand icoon
    </a>
  </div>
</div>
