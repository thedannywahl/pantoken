<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 28px">
    <!-- Toggle variant: the buttons connect into ONE segmented, single-select control (shared name) -->
    <fieldset class="instui-radio-input-group -variant-toggle">
      <legend>T-shirt maat</legend>
      <label class="instui-radio -variant-toggle">
        <input type="radio" name="size" checked /> Klein
      </label>
      <label class="instui-radio -variant-toggle">
        <input type="radio" name="size" /> Medium
      </label>
      <label class="instui-radio -variant-toggle"> <input type="radio" name="size" /> Groot </label>
    </fieldset>

    <!-- Simple variant (default): standard radios, stacked -->
    <fieldset class="instui-radio-input-group">
      <legend>Frequentie van meldingen</legend>
      <label class="instui-radio"><input type="radio" name="freq" checked /> Realtime</label>
      <label class="instui-radio"><input type="radio" name="freq" /> Dagelijkse samenvatting</label>
      <label class="instui-radio"><input type="radio" name="freq" /> Wekelijkse samenvatting</label>
    </fieldset>

    <!-- Simple variant, laid out in a row -->
    <fieldset class="instui-radio-input-group -layout-columns">
      <legend>Contactmethode</legend>
      <label class="instui-radio"><input type="radio" name="contact" checked /> E-mail</label>
      <label class="instui-radio"><input type="radio" name="contact" /> Telefoon</label>
      <label class="instui-radio"><input type="radio" name="contact" /> Post</label>
    </fieldset>
  </div>
</div>
