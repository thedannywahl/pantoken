<div class="instui-card">
  <div class="radio-demo">
    <section>
      <h4>Standaard</h4>
      <div class="stack">
        <label class="instui-radio"><input type="radio" name="r" checked /> Optie A</label>
        <label class="instui-radio"><input type="radio" name="r" /> Optie B</label>
        <label class="instui-radio -size-lg"><input type="radio" name="r2" checked /> Groot</label>
        <label class="instui-radio"
          ><input type="radio" name="r3" checked disabled /> Uitgeschakeld</label
        >
      </div>
    </section>

    <section>
      <h4>Toggle-knoppen (variant="toggle")</h4>
      <div class="group">
        <label class="instui-radio -variant-toggle"
          ><input type="radio" name="t" checked /> Klein</label
        >
        <label class="instui-radio -variant-toggle"><input type="radio" name="t" /> Medium</label>
        <label class="instui-radio -variant-toggle"><input type="radio" name="t" /> Groot</label>
      </div>
    </section>

    <section>
      <h4>Toggle contextkleuren</h4>
      <div class="group">
        <label class="instui-radio -variant-toggle -context-success"
          ><input type="radio" name="c1" checked /> Succes</label
        >
        <label class="instui-radio -variant-toggle -context-danger"
          ><input type="radio" name="c2" checked /> Gevaar</label
        >
        <label class="instui-radio -variant-toggle -context-warning"
          ><input type="radio" name="c3" checked /> Waarschuwing</label
        >
        <label class="instui-radio -variant-toggle -context-off"
          ><input type="radio" name="c4" checked /> Uit</label
        >
      </div>
    </section>
  </div>
</div>
