<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
    <label class="instui-checkbox"><input type="checkbox" checked /> Aangevinkt</label>
    <label class="instui-checkbox"><input type="checkbox" /> Niet aangevinkt</label>
    <label class="instui-checkbox"
      ><input type="checkbox" data-indeterminate /> Onbepaald</label
    >
    <label class="instui-checkbox -size-sm"><input type="checkbox" checked /> Klein</label>
    <label class="instui-checkbox -invalid"><input type="checkbox" /> Foutstatus</label>
    <label class="instui-checkbox"><input type="checkbox" checked disabled /> Uitgeschakeld</label>
    <label class="instui-checkbox -variant-toggle">
      <input type="checkbox" checked /> Tuimelschakelaar
    </label>

    <div style="display: flex; gap: 24px; align-items: flex-start; margin-top: 4px">
      <label class="instui-checkbox -variant-toggle -label-placement-top">
        <input type="checkbox" checked /> Label bovenaan
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-start">
        <input type="checkbox" /> Label aan het begin
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-end">
        <input type="checkbox" checked /> Label aan het einde
      </label>
    </div>
  </div>
</div>

<script>
  // The mixed state is a DOM property, not an attribute, so set it in script.
  document.querySelectorAll("[data-indeterminate]").forEach((el) => (el.indeterminate = true));
</script>
