<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 24px; max-width: 520px">
    <!-- The opt-in helper associates the authored error after a native validation attempt or blur. -->
    <label class="instui-form-field" data-native-validation>
      <span class="label" id="demo-email-label">{{text1}}</span>
      <span class="controls">
        <input
          class="instui-text-input"
          type="email"
          required
          autocomplete="email"
          placeholder="you@example.com"
          aria-labelledby="demo-email-label"
          aria-describedby="demo-email-hint"
        />
      </span>
      <span class="instui-form-field-messages">
        <span class="instui-form-field-message -type-hint" id="demo-email-hint">{{text2}}</span>
        <span class="instui-form-field-message -type-error" id="demo-email-error" hidden
          >{{text3}}</span
        >
      </span>
    </label>

    <!-- Explicit error state: `-invalid` on the field reveals the error message + red control border. -->
    <label class="instui-form-field -invalid">
      <span class="label" id="demo-username-label">{{text4}}</span>
      <span class="controls">
        <input
          class="instui-text-input -invalid"
          value="a"
          aria-labelledby="demo-username-label"
          aria-invalid="true"
          aria-describedby="demo-username-error"
        />
      </span>
      <span class="instui-form-field-messages">
        <span class="instui-form-field-message -type-error" id="demo-username-error"
          >{{text5}}</span
        >
      </span>
    </label>

    <!-- Inline layout: label beside the control -->
    <label class="instui-form-field -layout-inline -label-align-end">
      <span class="label">{{text6}}</span>
      <span class="controls">
        <input class="instui-text-input" placeholder="Optional" />
      </span>
    </label>

    <!-- Readonly + required-by-class -->
    <label class="instui-form-field -readonly -required">
      <span class="label">{{text7}}</span>
      <span class="controls">
        <input class="instui-text-input -readonly" value="ACME-00421" readonly />
      </span>
    </label>
  </div>
</div>
