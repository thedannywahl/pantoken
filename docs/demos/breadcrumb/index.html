<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 16px">
    <!-- Each crumb is a link; the last (current page) is plain text. A crumb can lead with an icon. -->
    <nav class="instui-breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li>
          <a class="-icon-house" href="#">{{text1}}</a>
        </li>
        <li><a href="#">{{text2}}</a></li>
        <li><a href="#">{{text3}}</a></li>
        <li aria-current="page">{{text4}}</li>
      </ol>
    </nav>

    <!-- -size-sm and -size-lg scale the text and separator gap. -->
    <nav class="instui-breadcrumb -size-sm" aria-label="Breadcrumb (small)">
      <ol>
        <li><a href="#">{{text5}}</a></li>
        <li><a href="#">{{text6}}</a></li>
        <li aria-current="page">{{text7}}</li>
      </ol>
    </nav>

    <nav class="instui-breadcrumb -size-lg" aria-label="Breadcrumb (large)">
      <ol>
        <li><a href="#">{{text8}}</a></li>
        <li><a href="#">{{text9}}</a></li>
        <li aria-current="page">{{text10}}</li>
      </ol>
    </nav>

    <!-- breadcrumbs without any links are automatically hidden. This code is below:
      <nav class="instui-breadcrumb" aria-label="Breadcrumb">
        <ol>
          <li class="-icon-house" aria-current="page">Home Page</li>
        </ol>
      </nav> 
    -->
    <nav class="instui-breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li class="-icon-house" aria-current="page">{{text11}}</li>
      </ol>
    </nav>
  </div>
</div>
