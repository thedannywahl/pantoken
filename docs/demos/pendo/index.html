<div class="pendo-showcase">
  <section class="pendo-example">
    <p class="pendo-example__label">{{popoverLabel}}</p>
    <div
      id="pendo-base-demo-popover"
      class="instui-popover _pendo-step-container _pendo-guide-tt_"
      data-layout="tooltipBlank"
      style="--pendo-overlay-width: min(22.5rem, 100%)"
    >
      <div id="pendo-backdrop-demo-popover" class="_pendo-guide-backdrop_">
        <div
          id="pendo-backdrop-0-demo-popover"
          class="pendo-backdrop-region-top _pendo-backdrop"
          pendo-region="top"
        ></div>
      </div>
      <div
        id="pendo-g-demo-popover"
        class="_pendo-step-container-size"
        data-vertical-alignment="Relative to Element"
        data-relative-alignment="true"
      >
        <div
          id="pendo-guide-container-demo-popover"
          class="_pendo-step-container-styles"
          role="dialog"
          aria-modal="false"
          aria-labelledby="pendo-title-demo-popover"
          tabindex="-1"
          data-caret-height="16px"
          data-caret-width="16px"
          data-caret-enabled="true"
        >
          <button class="_pendo-close-guide" type="button" aria-label="{{closeLabel}}">×</button>
          <div id="guide-components-demo-popover">
            <div class="pendo-block-wrapper">
              <div
                class="_pendo-row"
                data-component="title"
                data-pendo-display-flex="true"
                data-pendo-justify-content="flex-start"
              >
                <div class="bb-text _pendo-text-title">
                  <div class="bb-text _pendo-simple-text">
                    <h2 id="pendo-title-demo-popover" class="bb-text _pendo-simple-text">
                      {{popoverTitle}}
                    </h2>
                  </div>
                </div>
              </div>
            </div>
            <div class="pendo-block-wrapper">
              <div
                class="_pendo-row"
                data-component="subtitle"
                data-pendo-display-flex="true"
                data-pendo-justify-content="flex-start"
              >
                <div class="bb-text _pendo-text-subTitle">
                  <div class="bb-text _pendo-simple-text">
                    <h3 class="bb-text _pendo-simple-text">{{popoverSubtitle}}</h3>
                  </div>
                </div>
              </div>
            </div>
            <div class="pendo-block-wrapper">
              <div
                class="_pendo-row"
                data-component="text"
                data-pendo-display-flex="true"
                data-pendo-justify-content="flex-start"
              >
                <div class="bb-text _pendo-text-paragraph">
                  <div class="bb-text _pendo-simple-text"><p>{{popoverBody}}</p></div>
                </div>
              </div>
            </div>
            <div class="pendo-block-wrapper">
              <div
                class="_pendo-row"
                data-component="buttons"
                data-pendo-display-flex="true"
                data-pendo-justify-content="flex-start"
              >
                <div class="pendo-mock-flexbox-row">
                  <div class="pendo-mock-flexbox-element">
                    <button
                      class="bb-button _pendo-button-primaryButton _pendo-button"
                      type="button"
                    >
                      {{continueLabel}}
                    </button>
                  </div>
                  <div class="pendo-mock-flexbox-element">
                    <button
                      class="bb-button _pendo-button-secondaryButton _pendo-button"
                      type="button"
                    >
                      {{laterLabel}}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div
          data-caret-position="bottom"
          class="pendo-tooltip-caret pendo-tooltip-caret--top"
          style="bottom: -15px !important"
        ></div>
        <div
          data-caret-position="bottom"
          class="pendo-tooltip-caret-border"
          style="bottom: -16px !important"
        ></div>
      </div>
    </div>
  </section>

  <section class="pendo-example">
    <p class="pendo-example__label">{{alertLabel}}</p>
    <div
      id="pendo-base-demo-alert"
      class="instui-alert-info _pendo-step-container"
      data-layout="lightboxBlank"
    >
      <div id="pendo-backdrop-demo-alert" class="_pendo-guide-backdrop_">
        <div
          id="pendo-backdrop-0-demo-alert"
          class="pendo-backdrop-region-top _pendo-backdrop"
          pendo-region="top"
        ></div>
      </div>
      <div
        id="pendo-g-demo-alert"
        class="_pendo-step-container-size"
        data-relative-alignment="true"
      >
        <div
          id="pendo-guide-container-demo-alert"
          class="_pendo-step-container-styles"
          role="dialog"
          aria-modal="false"
          aria-labelledby="pendo-title-demo-alert"
          tabindex="-1"
        >
          <button class="_pendo-close-guide" type="button" aria-label="{{closeLabel}}">×</button>
          <div id="guide-components-demo-alert">
            <div class="pendo-block-wrapper">
              <div
                class="_pendo-row"
                data-component="title"
                data-pendo-display-flex="true"
                data-pendo-justify-content="flex-start"
              >
                <div class="bb-text _pendo-text-title">
                  <div class="bb-text _pendo-simple-text">
                    <h2 id="pendo-title-demo-alert" class="bb-text _pendo-simple-text">
                      {{alertTitle}}
                    </h2>
                  </div>
                </div>
              </div>
            </div>
            <div class="pendo-block-wrapper">
              <div
                class="_pendo-row"
                data-component="subtitle"
                data-pendo-display-flex="true"
                data-pendo-justify-content="flex-start"
              >
                <div class="bb-text _pendo-text-subTitle">
                  <div class="bb-text _pendo-simple-text">
                    <h3 class="bb-text _pendo-simple-text">{{alertSubtitle}}</h3>
                  </div>
                </div>
              </div>
            </div>
            <div class="pendo-block-wrapper">
              <div
                class="_pendo-row"
                data-component="text"
                data-pendo-display-flex="true"
                data-pendo-justify-content="flex-start"
              >
                <div class="bb-text _pendo-text-paragraph">
                  <div class="bb-text _pendo-simple-text"><p>{{alertBody}}</p></div>
                </div>
              </div>
            </div>
            <div class="pendo-block-wrapper">
              <div
                class="_pendo-row"
                data-component="buttons"
                data-pendo-display-flex="true"
                data-pendo-justify-content="flex-start"
              >
                <div class="pendo-mock-flexbox-row">
                  <div class="pendo-mock-flexbox-element">
                    <button
                      class="bb-button _pendo-button-primaryButton _pendo-button"
                      type="button"
                    >
                      {{alertPrimaryLabel}}
                    </button>
                  </div>
                  <div class="pendo-mock-flexbox-element">
                    <button
                      class="bb-button _pendo-button-secondaryButton _pendo-button"
                      type="button"
                    >
                      {{alertSecondaryLabel}}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="pendo-example">
    <p class="pendo-example__label">{{bannerLabel}}</p>
    <div
      id="pendo-base-demo-banner"
      class="instui _pendo-step-container"
      data-layout="lightboxBlank"
    >
      <div id="pendo-backdrop-demo-banner" class="_pendo-guide-backdrop_">
        <div
          id="pendo-backdrop-0-demo-banner"
          class="pendo-backdrop-region-top _pendo-backdrop"
          pendo-region="top"
        ></div>
      </div>
      <div
        id="pendo-g-demo-banner"
        class="_pendo-step-container-size"
        data-relative-alignment="true"
      >
        <div
          id="pendo-guide-container-demo-banner"
          class="_pendo-step-container-styles"
          role="dialog"
          aria-modal="false"
          aria-labelledby="pendo-title-demo-banner"
          tabindex="-1"
        >
          <button class="_pendo-close-guide" type="button" aria-label="{{closeLabel}}">×</button>
          <div id="guide-components-demo-banner">
            <div class="pendo-block-wrapper">
              <div
                class="_pendo-row"
                data-component="title"
                data-pendo-display-flex="true"
                data-pendo-justify-content="flex-start"
              >
                <div class="bb-text _pendo-text-title">
                  <div class="bb-text _pendo-simple-text">
                    <h2 id="pendo-title-demo-banner" class="bb-text _pendo-simple-text">
                      {{bannerTitle}}
                    </h2>
                  </div>
                </div>
              </div>
            </div>
            <div class="pendo-block-wrapper">
              <div
                class="_pendo-row"
                data-component="subtitle"
                data-pendo-display-flex="true"
                data-pendo-justify-content="flex-start"
              >
                <div class="bb-text _pendo-text-subTitle">
                  <div class="bb-text _pendo-simple-text">
                    <h3 class="bb-text _pendo-simple-text">{{bannerSubtitle}}</h3>
                  </div>
                </div>
              </div>
            </div>
            <div class="pendo-block-wrapper">
              <div
                class="_pendo-row"
                data-component="text"
                data-pendo-display-flex="true"
                data-pendo-justify-content="flex-start"
              >
                <div class="bb-text _pendo-text-paragraph">
                  <div class="bb-text _pendo-simple-text"><p>{{bannerBody}}</p></div>
                </div>
              </div>
            </div>
            <div class="pendo-block-wrapper">
              <div
                class="_pendo-row"
                data-component="buttons"
                data-pendo-display-flex="true"
                data-pendo-justify-content="flex-start"
              >
                <div class="pendo-mock-flexbox-row">
                  <div class="pendo-mock-flexbox-element">
                    <button
                      class="bb-button _pendo-button-primaryButton _pendo-button"
                      type="button"
                    >
                      {{primaryLabel}}
                    </button>
                  </div>
                  <div class="pendo-mock-flexbox-element">
                    <button
                      class="bb-button _pendo-button-secondaryButton _pendo-button"
                      type="button"
                    >
                      {{secondaryLabel}}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
