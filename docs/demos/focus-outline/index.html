<div class="instui-card">
  <div class="focus-demo">
    <p class="hint">{{text1}} <code>base.css</code>{{text2}}</p>

    <section>
      <h4>{{text3}}</h4>
      <div class="row">
        <button class="instui-button">{{text4}}</button>
        <a class="instui-link" href="#focus-demo">{{text5}}</a>
        <input class="field" placeholder="Input" />
      </div>
    </section>

    <section>
      <h4>{{text6}}</h4>
      <div class="row">
        <button class="instui-button">{{text7}}</button>
        <button class="instui-button -color-success -focus-color-success">{{text8}}</button>
        <button class="instui-button -color-danger -focus-color-danger">{{text9}}</button>
      </div>
    </section>

    <section>
      <h4>{{text10}}</h4>
      <div class="row">
        <button class="instui-button -focus-position-inset">{{text11}}</button>
        <button class="instui-button -without-focus-animation">{{text12}}</button>
      </div>
    </section>

    <section>
      <h4>{{text13}}</h4>
      <label class="within -focus-within">
        <span class="lbl">{{text14}}</span>
        <input class="field" placeholder="Focus me — the whole box rings" />
      </label>
    </section>
  </div>
</div>
