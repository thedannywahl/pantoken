<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
    <label class="instui-checkbox"><input type="checkbox" checked /> {{text1}}</label>
    <label class="instui-checkbox"><input type="checkbox" /> {{text2}}</label>
    <label class="instui-checkbox"><input type="checkbox" data-indeterminate /> {{text3}}</label>
    <label class="instui-checkbox -size-sm"><input type="checkbox" checked /> {{text4}}</label>
    <label class="instui-checkbox -invalid"><input type="checkbox" /> {{text5}}</label>
    <label class="instui-checkbox"><input type="checkbox" checked disabled /> {{text6}}</label>
    <label class="instui-checkbox -variant-toggle">
      <input type="checkbox" checked /> {{text7}}
    </label>

    <div style="display: flex; gap: 24px; align-items: flex-start; margin-top: 4px">
      <label class="instui-checkbox -variant-toggle -label-placement-top">
        <input type="checkbox" checked /> {{text8}}
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-start">
        <input type="checkbox" /> {{text9}}
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-end">
        <input type="checkbox" checked /> {{text10}}
      </label>
    </div>
  </div>
</div>
