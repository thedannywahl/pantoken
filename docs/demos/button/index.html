<div class="instui-card">
  <div class="button-demo">
    <section>
      <h4>{{text1}}</h4>
      <div class="row">
        <button class="instui-button">{{text2}}</button>
        <button class="instui-button -color-secondary">{{text3}}</button>
        <button class="instui-button -color-tertiary">{{text4}}</button>
        <button class="instui-button -color-success">{{text5}}</button>
        <button class="instui-button -color-danger">{{text6}}</button>
      </div>
    </section>

    <section>
      <h4>{{text7}}</h4>
      <div class="row">
        <button class="instui-button -color-ai">{{text8}}</button>
        <button class="instui-button -color-ai-secondary">{{text9}}</button>
      </div>
    </section>

    <section>
      <h4>{{text10}}</h4>
      <div class="row on-brand">
        <button class="instui-button -color-primary-inverse">{{text11}}</button>
        <button class="instui-button -color-primary -on-color">{{text31}}</button>
        <button class="instui-button -color-secondary -on-color">{{text32}}</button>
      </div>
    </section>

    <section>
      <h4>{{text12}}</h4>
      <div class="row">
        <button class="instui-button -without-background">{{text13}}</button>
        <button class="instui-button -color-secondary -without-background">{{text14}}</button>
      </div>
    </section>

    <section>
      <h4>{{text15}}</h4>
      <button class="instui-button -display-block">{{text16}}</button>
    </section>

    <section>
      <h4>{{text17}}</h4>
      <div class="row">
        <button class="instui-button -size-sm">{{text18}}</button>
        <button class="instui-button">{{text19}}</button>
        <button class="instui-button -size-lg">{{text20}}</button>
      </div>
    </section>

    <section>
      <h4>{{text21}}</h4>
      <div class="row">
        <button class="instui-button">
          {{text22}}
          <span class="instui-icon -icon-arrow-right"></span>
        </button>
        <button class="instui-button -color-secondary">
          <span class="instui-icon -icon-download"></span>
          {{text23}}
        </button>
        <button class="instui-button -color-secondary" id="star" aria-pressed="false">
          <span class="instui-icon -icon-star"></span>
          <span id="star-label">{{text24}}</span>
        </button>
        <!-- Icon-only: the glyph rides the button; name it with aria-label… -->
        <button class="instui-button -shape-square -icon-arrow-right" aria-label="Next"></button>
        <!-- …or with visually-hidden text (use one, not both). -->
        <button class="instui-button -shape-circle -icon-plus">
          <span class="instui-screen-reader-content">{{text25}}</span>
        </button>
      </div>
    </section>

    <section>
      <h4>{{text26}}</h4>
      <div class="row">
        <button class="instui-button -condensed">{{text27}}</button>
        <button class="instui-button -condensed -size-sm">{{text28}}</button>
        <button class="instui-button -toggle" id="toggle" aria-pressed="false">{{text29}}</button>
        <button class="instui-button" disabled>{{text30}}</button>
      </div>
    </section>
  </div>
</div>
