<div class="instui-card">
  <h2 class="instui-heading -level-h3">Gap</h2>
  <p class="instui-text">
    Flex/grid <code>gap</code> classes on the spacing scale, short (<code>--gap-sm</code>) or long
    (<code>--gap-small</code>) spelling — usable bare or chained onto any component.
  </p>
  <div class="--display-flex --gap-sm">
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">gap-sm</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">One</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">Two</span>
    </div>
  </div>

  <h3 class="instui-heading -level-h5 --mt-lg">Long spelling</h3>
  <div class="--display-flex --gap-large">
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">gap-large</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">One</span>
    </div>
  </div>
</div>
