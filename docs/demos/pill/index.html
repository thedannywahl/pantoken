<div class="instui-card">
  <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap">
    <span class="instui-pill">{{text1}}</span>
    <span class="instui-pill -color-info">{{text2}}</span>
    <!-- Flat form: a glyph class on the pill renders the icon before the label. -->
    <span class="instui-pill -color-success -icon-check">{{text3}}</span>
    <span class="instui-pill -color-warning">{{text4}}</span>
    <span class="instui-pill -color-danger">{{text5}}</span>
  </div>
</div>
