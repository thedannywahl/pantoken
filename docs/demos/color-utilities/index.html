<div class="instui-card">
  <h2 class="instui-heading -level-h3">{{text1}}</h2>
  <p class="instui-text">
    <code>.--text-*</code> {{text2}} <code>.--bg-*</code> {{text3}}
    <code>.--border-*</code> {{text4}}
  </p>
  <p class="instui-text --text-success --mb-2xs">{{text5}}</p>
  <p class="instui-text --text-warning --mb-2xs">{{text6}}</p>
  <p class="instui-text --text-error --mb-2xs">{{text7}}</p>
  <p class="instui-text --text-info">{{text8}}</p>

  <h3 class="instui-heading -level-h5 --mt-lg">{{text9}}</h3>
  <p class="instui-text -color-secondary">{{text10}} <code>.--text-on-color</code>.</p>
  <div style="display: flex; gap: var(--instui-spacing-space-sm); flex-wrap: wrap">
    <div
      class="instui-view --bg-accent-green --text-on-color --p-sm"
      style="border-radius: var(--instui-border-radius-md)"
    >
      <span class="instui-text --text-on-color">{{text11}}</span>
    </div>
    <div
      class="instui-view --bg-accent-plum --text-on-color --p-sm"
      style="border-radius: var(--instui-border-radius-md)"
    >
      <span class="instui-text --text-on-color">{{text12}}</span>
    </div>
    <div
      class="instui-view --border-strong --p-sm"
      style="border-width: 1px; border-style: solid; border-radius: var(--instui-border-radius-md)"
    >
      <span class="instui-text">{{text13}}</span>
    </div>
    <div
      class="instui-view --border-brand --p-sm"
      style="border-width: 1px; border-style: solid; border-radius: var(--instui-border-radius-md)"
    >
      <span class="instui-text">{{text14}}</span>
    </div>
  </div>
</div>
