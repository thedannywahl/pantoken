<div class="instui-card">
  <h2 class="instui-heading -level-h3">{{text1}}</h2>
  <p class="instui-text">
    {{text2}}
    <code>font-weight</code>, <code>font-family</code>, <code>border-radius</code>{{text3}}
    <code>box-shadow</code>{{text4}} <code>opacity</code>.
  </p>
  <p class="instui-text --font-weight-body-base --mb-2xs">{{text5}}</p>
  <p class="instui-text --font-weight-body-strong --mb-2xs">{{text6}}</p>
  <p class="instui-text --font-family-code --mb-sm">{{text7}}</p>
  <div
    style="display: flex; gap: var(--instui-spacing-space-sm); flex-wrap: wrap; align-items: center"
  >
    <div class="instui-text instui-view --bg-muted --p-md --border-radius-container-sm">
      {{text8}}
    </div>
    <div class="instui-text instui-view --bg-muted --p-md --border-radius-container-lg">
      {{text9}}
    </div>
    <div
      class="instui-text instui-view --bg-muted --p-md --elevation-resting"
      style="border-radius: var(--instui-border-radius-md)"
    >
      {{text10}}
    </div>
    <div
      class="instui-text instui-view --bg-muted --p-md --elevation-topmost"
      style="border-radius: var(--instui-border-radius-md)"
    >
      {{text11}}
    </div>
    <div
      class="instui-text instui-view --bg-muted --p-md --opacity-disabled"
      style="border-radius: var(--instui-border-radius-md)"
    >
      {{text12}}
    </div>
  </div>
</div>
