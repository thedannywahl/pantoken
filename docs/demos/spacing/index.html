<div class="instui-card">
  <h2 class="instui-heading -level-h3">{{text1}}</h2>
  <p class="instui-text">
    {{text2}} <code>m</code>/<code>p</code>
    {{text3}}<code>t</code>/<code>b</code>/<code>s</code>/<code>e</code>/<code>x</code>/<code>y</code>{{text4}}<code>0</code>,
    <code>2xs</code>…<code>2xl</code>{{text5}} <code>auto</code> {{text6}}
    <code>--mb-sm</code> {{text7}} <code>--margin-bottom-small</code>.
  </p>
  <div class="instui-view --bg-muted --p-sm" style="border-radius: var(--instui-border-radius-md)">
    <div class="instui-view --bg-accent-blue --text-on-color --p-xs --mb-2xs">
      <span class="instui-text --text-on-color">{{text8}}</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm --mb-2xs">
      <span class="instui-text --text-on-color">{{text9}}</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-lg">
      <span class="instui-text --text-on-color">{{text10}}</span>
    </div>
  </div>

  <h3 class="instui-heading -level-h5 --mt-lg">{{text11}}</h3>
  <div
    class="instui-view --bg-muted --p-sm --mx-auto"
    style="max-width: 12rem; border-radius: var(--instui-border-radius-md); text-align: center"
  >
    <span class="instui-text">{{text12}}</span>
  </div>

  <h3 class="instui-heading -level-h5 --mt-lg">{{text13}}</h3>
  <div
    class="instui-view --bg-muted --padding-medium"
    style="border-radius: var(--instui-border-radius-md)"
  >
    <div
      class="instui-view --bg-accent-blue --text-on-color --padding-small --margin-bottom-x-small"
    >
      <span class="instui-text --text-on-color">{{text14}}</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --padding-large">
      <span class="instui-text --text-on-color">{{text15}}</span>
    </div>
  </div>
</div>
