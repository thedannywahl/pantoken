<div class="instui-card">
  <!-- hover="true": rows highlight with a brand vertical bar on each edge (not a full box) -->
  <div
    class="--overflow-x-auto -focus-position-inset -without-focus-animation"
    role="region"
    aria-labelledby="demo-table-caption"
    tabindex="0"
  >
    <table class="instui-table -hover">
      <caption id="demo-table-caption">
        {{text1}}
      </caption>
      <thead>
        <tr>
          <th scope="col">{{text2}}</th>
          <th scope="col">{{text3}}</th>
          <th scope="col">{{text4}}</th>
          <th scope="col">{{text5}}</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row">1</th>
          <td>{{text6}}</td>
          <td>1994</td>
          <td>9.3</td>
        </tr>
        <tr>
          <th scope="row">2</th>
          <td>{{text7}}</td>
          <td>1972</td>
          <td>9.2</td>
        </tr>
        <tr>
          <th scope="row">3</th>
          <td>{{text8}}</td>
          <td>1974</td>
          <td>9.0</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Container width, not viewport width, selects the existing stacked presentation. -->
<div class="instui-card instui-container" style="margin-top: 24px">
  <table class="instui-table -layout-responsive">
    <caption>
      {{text9}}
    </caption>
    <thead>
      <tr>
        <th scope="col">{{text10}}</th>
        <th scope="col">{{text11}}</th>
        <th scope="col">{{text12}}</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td data-label="{{text10}}">{{text13}}</td>
        <td data-label="{{text11}}">1994</td>
        <td data-label="{{text12}}">9.3</td>
      </tr>
      <tr>
        <td data-label="{{text10}}">{{text14}}</td>
        <td data-label="{{text11}}">1972</td>
        <td data-label="{{text12}}">9.2</td>
      </tr>
    </tbody>
  </table>
</div>
