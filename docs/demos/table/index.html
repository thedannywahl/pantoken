<div class="instui-card">
  <!-- hover="true": rows highlight with a brand vertical bar on each edge (not a full box) -->
  <table class="instui-table -hover">
    <caption>
      {{text1}}
    </caption>
    <thead>
      <tr>
        <th scope="col">{{text2}}</th>
        <th scope="col">{{text3}}</th>
        <th scope="col">{{text4}}</th>
        <th scope="col">{{text5}}</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <th scope="row">1</th>
        <td>{{text6}}</td>
        <td>1994</td>
        <td>9.3</td>
      </tr>
      <tr>
        <th scope="row">2</th>
        <td>{{text7}}</td>
        <td>1972</td>
        <td>9.2</td>
      </tr>
      <tr>
        <th scope="row">3</th>
        <td>{{text8}}</td>
        <td>1974</td>
        <td>9.0</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- layout="stacked": each row's cells stack and show their column via data-label, separated by a rule -->
<div class="instui-card" style="max-width: 340px; margin-top: 24px">
  <table class="instui-table -layout-stacked">
    <caption>
      {{text9}}
    </caption>
    <thead>
      <tr>
        <th scope="col">{{text10}}</th>
        <th scope="col">{{text11}}</th>
        <th scope="col">{{text12}}</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td data-label="Title">{{text13}}</td>
        <td data-label="Year">1994</td>
        <td data-label="Rating">9.3</td>
      </tr>
      <tr>
        <td data-label="Title">{{text14}}</td>
        <td data-label="Year">1972</td>
        <td data-label="Rating">9.2</td>
      </tr>
    </tbody>
  </table>
</div>
