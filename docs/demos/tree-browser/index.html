<div class="instui-card">
  <div
    class="instui-tree-browser"
    role="tree"
    aria-labelledby="demo-course-tree-label"
    style="max-width: 320px"
  >
    <div role="none">
      <div
        role="treeitem"
        tabindex="0"
        aria-expanded="true"
        aria-selected="false"
        aria-labelledby="demo-course-tree-label"
        aria-owns="demo-course-tree-group"
      >
        <span class="item" id="demo-course-tree-label">
          <span class="instui-icon -icon-folder" aria-hidden="true"></span> {{text1}}
        </span>
      </div>
      <div role="group" id="demo-course-tree-group">
        <a class="item" role="treeitem" tabindex="-1" aria-selected="false" href="#syllabus">
          <span class="instui-icon -icon-file-text" aria-hidden="true"></span> {{text2}}
        </a>
        <div role="none">
          <div
            role="treeitem"
            tabindex="-1"
            aria-expanded="false"
            aria-selected="false"
            aria-labelledby="demo-week-tree-label"
            aria-owns="demo-week-tree-group"
          >
            <span class="item" id="demo-week-tree-label">
              <span class="instui-icon -icon-folder" aria-hidden="true"></span> {{text3}}
            </span>
          </div>
          <div role="group" id="demo-week-tree-group" hidden>
            <a class="item" role="treeitem" tabindex="-1" aria-selected="true" href="#reading">
              <span class="instui-icon -icon-file-text" aria-hidden="true"></span> {{text4}}
            </a>
            <a class="item" role="treeitem" tabindex="-1" aria-selected="false" href="#slides">
              <span class="instui-icon -icon-file-text" aria-hidden="true"></span> {{text5}}
            </a>
          </div>
        </div>
        <a class="item" role="treeitem" tabindex="-1" aria-selected="false" href="#rubric">
          <span class="instui-icon -icon-file-text" aria-hidden="true"></span> {{text6}}
        </a>
      </div>
    </div>
  </div>
</div>
