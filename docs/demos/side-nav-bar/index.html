<!-- The rail sits on a page (no card) and runs full height. This demo gives it a page-tall row; in a
     real layout the nav is one full-height column beside the content. -->
<div style="display: flex; min-height: 420px; background: var(--instui-color-background-secondary)">
  <nav class="instui-side-nav-bar" aria-label="Primary">
    <a class="item -selected" href="#"
      ><span class="instui-icon -icon-house"></span><span class="label">{{text1}}</span></a
    >
    <a class="item" href="#"
      ><span class="instui-icon -icon-inbox"></span><span class="label">{{text2}}</span></a
    >
    <a class="item" href="#"
      ><span class="instui-icon -icon-calendar"></span><span class="label">{{text3}}</span></a
    >
    <a class="item" href="#"
      ><span class="instui-icon -icon-settings"></span><span class="label">{{text4}}</span></a
    >
  </nav>

  <!-- -minimized: icons only (labels hidden). -->
  <nav class="instui-side-nav-bar -minimized" aria-label="Primary (minimized)">
    <a class="item -selected" href="#"
      ><span class="instui-icon -icon-house"></span><span class="label">{{text5}}</span></a
    >
    <a class="item" href="#"
      ><span class="instui-icon -icon-inbox"></span><span class="label">{{text6}}</span></a
    >
    <a class="item" href="#"
      ><span class="instui-icon -icon-calendar"></span><span class="label">{{text7}}</span></a
    >
  </nav>

  <div style="flex: 1; padding: 24px" class="instui-text">{{text8}}</div>
</div>
