<div class="instui-card">
  <!-- Responsive visibility utilities react to the viewport width, matched to the size scale. Resize the
       preview to see them swap: the first shows only on narrow viewports, the second only on wide ones. -->
  <div style="display: flex; flex-direction: column; gap: 12px">
    <div class="instui-alert -color-info instui-hidden-min-md">
      {{text1}} <code>md</code> {{text2}} <code>-hidden-min-md</code>.
    </div>
    <div class="instui-alert -color-success instui-hidden-max-md">
      {{text3}} <code>md</code> {{text4}} <code>-hidden-max-md</code>.
    </div>
    <p class="instui-text -size-sm --text-muted">
      {{text5}} <code>sm</code> {{text6}} <code>md</code> {{text7}} <code>lg</code> {{text8}}
      <code>xl</code> {{text9}} <code>container-type: inline-size</code> {{text10}}
      <code>@container</code> {{text11}}
    </p>
  </div>
</div>
