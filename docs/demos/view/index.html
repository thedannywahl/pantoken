<div class="instui-card">
  <h2 class="instui-heading -level-h3">{{text1}}</h2>
  <p class="instui-text"><code>.instui-view</code> {{text2}} <code>View</code>{{text3}}</p>

  <h3 class="instui-heading -level-h5 --mt-lg">{{text4}}</h3>
  <div class="instui-view --p-md --mb-sm -background-primary -border-radius-large -shadow-resting">
    <span class="instui-text">{{text5}}</span>
  </div>
  <div
    class="instui-view --p-md --mb-sm -border-width-small -border-color-brand -border-radius-medium"
  >
    <span class="instui-text">{{text6}}</span>
  </div>
  <div
    class="instui-view --p-md -background-brand -border-radius-medium --text-on-color"
    style="color: var(--instui-color-text-on-color)"
  >
    <span class="instui-text --text-on-color">{{text7}}</span>
  </div>

  <h3 class="instui-heading -level-h5 --mt-lg">{{text8}}</h3>
  <p class="instui-text -color-secondary">
    {{text9}}
    <code>--bg-accent-blue</code> + <code>--text-on-color</code> + <code>--p-md</code>.
  </p>
  <div class="instui-view --bg-accent-blue --text-on-color --p-md -border-radius-medium">
    <span class="instui-text --text-on-color">{{text10}}</span>
  </div>
</div>
