<div class="instui-card">
  <!-- The interactions bundle manages delays and Escape; CSS hover/focus remains the no-JS fallback. -->
  <div style="display: flex; gap: 24px; align-items: center; padding: 24px 0">
    <span class="instui-tooltip">
      <button
        class="instui-icon-button"
        type="button"
        aria-label="{{text5}}"
        aria-describedby="tt-1"
      >
        <span class="instui-icon -icon-info" aria-hidden="true"></span>
      </button>
      <span class="tip" id="tt-1" role="tooltip">{{text1}}</span>
    </span>

    <span class="instui-tooltip">
      <button class="instui-button -color-secondary" type="button" aria-describedby="tt-2">
        {{text2}}
      </button>
      <span class="tip -placement-bottom" id="tt-2" role="tooltip">{{text3}}</span>
    </span>

    <span class="instui-tooltip">
      <button
        class="instui-icon-button"
        type="button"
        aria-label="{{text6}}"
        aria-describedby="tt-3"
      >
        <span class="instui-icon -icon-bell" aria-hidden="true"></span>
      </button>
      <span class="tip -placement-end" id="tt-3" role="tooltip">{{text4}}</span>
    </span>
  </div>
</div>
