<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 28px">
    <!-- Toggle variant: the buttons connect into ONE segmented, single-select control (shared name) -->
    <fieldset class="instui-radio-input-group -variant-toggle">
      <legend>Talla de samarreta</legend>
      <label class="instui-radio -variant-toggle">
        <input type="radio" name="size" checked /> Petita
      </label>
      <label class="instui-radio -variant-toggle">
        <input type="radio" name="size" /> Mitjana
      </label>
      <label class="instui-radio -variant-toggle"> <input type="radio" name="size" /> Gran </label>
    </fieldset>

    <!-- Simple variant (default): standard radios, stacked -->
    <fieldset class="instui-radio-input-group">
      <legend>Freqüència de notificació</legend>
      <label class="instui-radio"><input type="radio" name="freq" checked /> Temps real</label>
      <label class="instui-radio"><input type="radio" name="freq" /> Resum diari</label>
      <label class="instui-radio"><input type="radio" name="freq" /> Resum setmanal</label>
    </fieldset>

    <!-- Simple variant, laid out in a row -->
    <fieldset class="instui-radio-input-group -layout-columns">
      <legend>Mètode de contacte</legend>
      <label class="instui-radio"><input type="radio" name="contact" checked /> Correu electrònic</label>
      <label class="instui-radio"><input type="radio" name="contact" /> Telèfon</label>
      <label class="instui-radio"><input type="radio" name="contact" /> Correu postal</label>
    </fieldset>
  </div>
</div>
