<div class="instui-card">
  <div class="radio-demo">
    <section>
      <h4>Estàndard</h4>
      <div class="stack">
        <label class="instui-radio"><input type="radio" name="r" checked /> Opció A</label>
        <label class="instui-radio"><input type="radio" name="r" /> Opció B</label>
        <label class="instui-radio -size-lg"><input type="radio" name="r2" checked /> Gran</label>
        <label class="instui-radio"
          ><input type="radio" name="r3" checked disabled /> Desactivat</label
        >
      </div>
    </section>

    <section>
      <h4>Botons de commutació (variant="toggle")</h4>
      <div class="group">
        <label class="instui-radio -variant-toggle"
          ><input type="radio" name="t" checked /> Petit</label
        >
        <label class="instui-radio -variant-toggle"><input type="radio" name="t" /> Mitjà</label>
        <label class="instui-radio -variant-toggle"><input type="radio" name="t" /> Gran</label>
      </div>
    </section>

    <section>
      <h4>Canviar colors de context</h4>
      <div class="group">
        <label class="instui-radio -variant-toggle -context-success"
          ><input type="radio" name="c1" checked /> Èxit</label
        >
        <label class="instui-radio -variant-toggle -context-danger"
          ><input type="radio" name="c2" checked /> Perill</label
        >
        <label class="instui-radio -variant-toggle -context-warning"
          ><input type="radio" name="c3" checked /> Avís</label
        >
        <label class="instui-radio -variant-toggle -context-off"
          ><input type="radio" name="c4" checked /> Desactivat</label
        >
      </div>
    </section>
  </div>
</div>
