<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
    <label class="instui-checkbox"><input type="checkbox" checked /> Marcat</label>
    <label class="instui-checkbox"><input type="checkbox" /> Desmarcat</label>
    <label class="instui-checkbox"
      ><input type="checkbox" data-indeterminate /> Indeterminat</label
    >
    <label class="instui-checkbox -size-sm"><input type="checkbox" checked /> Petit</label>
    <label class="instui-checkbox -invalid"><input type="checkbox" /> Estat d'error</label>
    <label class="instui-checkbox"><input type="checkbox" checked disabled /> Inhabilitat</label>
    <label class="instui-checkbox -variant-toggle">
      <input type="checkbox" checked /> Commutador
    </label>

    <div style="display: flex; gap: 24px; align-items: flex-start; margin-top: 4px">
      <label class="instui-checkbox -variant-toggle -label-placement-top">
        <input type="checkbox" checked /> Etiqueta a dalt
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-start">
        <input type="checkbox" /> Etiqueta a l'inici
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-end">
        <input type="checkbox" checked /> Etiqueta al final
      </label>
    </div>
  </div>
</div>

<script>
  // The mixed state is a DOM property, not an attribute, so set it in script.
  document.querySelectorAll("[data-indeterminate]").forEach((el) => (el.indeterminate = true));
</script>
