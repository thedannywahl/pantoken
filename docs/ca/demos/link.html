<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-start">
    <a class="instui-link" href="#">Un enllaç amb estil</a>
    <a class="instui-link -size-lg" href="#">Un enllaç gran</a>

    <!-- iconPlacement is just DOM order: an .instui-icon child before or after the text. -->
    <a class="instui-link" href="#">
      <span class="instui-icon -icon-download"></span>
      Icona a l'inici
    </a>
    <a class="instui-link" href="#">
      Icona al final
      <span class="instui-icon -icon-arrow-right"></span>
    </a>

    <p class="instui-text">
      Llegiu la <a class="instui-link -inline" href="#">documentació en línia</a> per obtenir tots els detalls.
    </p>

    <a class="instui-link -unstyled" href="#">Enllaç sense estil</a>
  </div>

  <!-- color="link-inverse": for links on a dark surface. -->
  <div
    style="
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      background: var(--instui-color-background-inverse);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    "
  >
    <a class="instui-link -color-inverse" href="#">Un enllaç sobre un fons fosc</a>
    <a class="instui-link -color-inverse" href="#">
      <span class="instui-icon -icon-external-link"></span>
      Amb una icona inicial
    </a>
  </div>
</div>
