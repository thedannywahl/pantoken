<div class="instui-card" style="display: flex; flex-direction: column; gap: 24px">
  <!-- Default variant: underline tabs -->
  <div class="instui-tabs" data-tabs>
    <div class="list" role="tablist" aria-label="Default tabs">
      <button class="tab -selected" role="tab" aria-selected="true" data-panel="Overview">
        Resum
      </button>
      <button class="tab" role="tab" aria-selected="false" data-panel="Details">Detalls</button>
      <button class="tab -disabled" role="tab" aria-disabled="true" disabled data-panel="Disabled">
        Inhabilitat
      </button>
      <button class="tab" role="tab" aria-selected="false" data-panel="History">Historial</button>
    </div>
    <div class="panel" role="tabpanel">El contingut de la pestanya Resum es mostra aquí.</div>
  </div>

  <!-- Secondary variant: connected "folder" tabs (variant on the container) -->
  <div class="instui-tabs -variant-secondary" data-tabs>
    <div class="list" role="tablist" aria-label="Secondary tabs">
      <button class="tab" role="tab" aria-selected="false" data-panel="First">
        Primera pestanya
      </button>
      <button class="tab -disabled" role="tab" aria-disabled="true" disabled data-panel="Disabled">
        Inhabilitat
      </button>
      <button class="tab -selected" role="tab" aria-selected="true" data-panel="Third">
        Tercera pestanya
      </button>
      <button class="tab" role="tab" aria-selected="false" data-panel="Fourth">
        Quarta pestanya
      </button>
    </div>
    <div class="panel" role="tabpanel">El contingut de la tercera pestanya es mostra aquí.</div>
  </div>
</div>
