<div class="instui-card">
  <div class="button-demo">
    <section>
      <h4>Colors</h4>
      <div class="row">
        <button class="instui-button">Primari</button>
        <button class="instui-button -color-secondary">Secundari</button>
        <button class="instui-button -color-tertiary">Terciari</button>
        <button class="instui-button -color-success">Èxit</button>
        <button class="instui-button -color-danger">Perill</button>
      </div>
    </section>

    <section>
      <h4>AI</h4>
      <div class="row">
        <button class="instui-button -color-ai">IA primari</button>
        <button class="instui-button -color-ai-secondary">IA secundari</button>
      </div>
    </section>

    <section>
      <h4>Primari invers (en una superfície de color)</h4>
      <div class="row on-brand">
        <button class="instui-button -color-primary-inverse">Primari invers</button>
      </div>
    </section>

    <section>
      <h4>Fantasma (sense fons)</h4>
      <div class="row">
        <button class="instui-button -without-background">Primari fantasma</button>
        <button class="instui-button -color-secondary -without-background">
          Secundari fantasma
        </button>
      </div>
    </section>

    <section>
      <h4>Bloc (amplada completa)</h4>
      <button class="instui-button -display-block">Botó de bloc</button>
    </section>

    <section>
      <h4>Mides</h4>
      <div class="row">
        <button class="instui-button -size-sm">Petit</button>
        <button class="instui-button">Mitjà</button>
        <button class="instui-button -size-lg">Gran</button>
      </div>
    </section>

    <section>
      <h4>Icones i formes</h4>
      <div class="row">
        <button class="instui-button">
          Continua
          <span class="instui-icon -icon-arrow-right"></span>
        </button>
        <button class="instui-button -color-secondary">
          <span class="instui-icon -icon-download"></span>
          Descarrega
        </button>
        <button class="instui-button -color-secondary" id="star" aria-pressed="false">
          <span class="instui-icon -icon-star"></span>
          <span id="star-label">Estrella</span>
        </button>
        <!-- Icon-only: the glyph rides the button; name it with aria-label… -->
        <button class="instui-button -shape-square -icon-arrow-right" aria-label="Next"></button>
        <!-- …or with visually-hidden text (use one, not both). -->
        <button class="instui-button -shape-circle -icon-plus">
          <span class="instui-screen-reader-content">Afegeix</span>
        </button>
      </div>
    </section>

    <section>
      <h4>Condensat i estats</h4>
      <div class="row">
        <button class="instui-button -condensed">Condensat</button>
        <button class="instui-button -condensed -size-sm">Condensat petit</button>
        <button class="instui-button -toggle" id="toggle" aria-pressed="false">Commuta</button>
        <button class="instui-button" disabled>Inhabilitat</button>
      </div>
    </section>
  </div>
</div>
