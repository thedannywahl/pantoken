<div class="instui-card">
  <div class="focus-demo">
    <p class="hint">
      انتقل عبر عناصر التحكم (أو انقر الحقل) لرؤية الحلقة. تظهر على كل عنصر قابل للتركيز افتراضيًا
      من <code>base.css</code>; تعدل المعدلات لونها، أو تجعلها داخلية، أو تطفئ الحركة.
    </p>

    <section>
      <h4>حلقة الافتراضية (أي عنصر قابل للتركيز)</h4>
      <div class="row">
        <button class="instui-button">زر</button>
        <a class="instui-link" href="#focus-demo">رابط</a>
        <input class="field" placeholder="Input" />
      </div>
    </section>

    <section>
      <h4>لون الحلقة</h4>
      <div class="row">
        <button class="instui-button">معلومات (افتراضي)</button>
        <button class="instui-button -color-success -focus-color-success">نجاح</button>
        <button class="instui-button -color-danger -focus-color-danger">خطر</button>
      </div>
    </section>

    <section>
      <h4>الموضع والحركة</h4>
      <div class="row">
        <button class="instui-button -focus-position-inset">حلقة داخلية</button>
        <button class="instui-button -without-focus-animation">لا حركة</button>
      </div>
    </section>

    <section>
      <h4>التركيز بالداخل (يظهر عند النقر أيضًا)</h4>
      <label class="within -focus-within">
        <span class="lbl">بحث</span>
        <input class="field" placeholder="Focus me — the whole box rings" />
      </label>
    </section>
  </div>
</div>
