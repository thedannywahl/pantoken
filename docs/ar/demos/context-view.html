<div class="instui-card">
  <!-- As a native popover, `popovertarget` toggles it with no JavaScript: it opens in the top layer
       and light-dismisses on Esc or an outside click. The trigger's `anchor-name` lets it dock below the
       button (-placement-bottom) where CSS anchor positioning is supported. -->
  <button
    class="instui-button -color-secondary"
    popovertarget="cv-popover"
    style="anchor-name: --pantoken-anchor"
  >
    عرض التفاصيل
  </button>

  <div
    id="cv-popover"
    popover
    class="instui-context-view -placement-bottom"
    style="max-width: 320px"
  >
    تعرض واجهة السياق لفتة مع سهم. كنافذة منبثقة، تكون في الطبقة العليا وتغلق عند النقر خارجه أو
    الضغط على Esc.
  </div>

  <!-- Static placements: the caret sits on the edge facing the thing the view explains. -->
  <div style="display: flex; flex-wrap: wrap; gap: 32px; margin-top: 32px; align-items: flex-start">
    <div class="instui-context-view -placement-top">الموضع في الأعلى</div>
    <div class="instui-context-view -placement-bottom">الموضع في الأسفل</div>
    <div class="instui-context-view -placement-start">الموضع في البداية</div>
    <div class="instui-context-view -placement-end">الموضع في النهاية</div>
    <div class="instui-context-view -color-inverse">خلفية عكسية</div>
  </div>

  <p class="instui-text --text-muted" style="margin-top: 16px">
    التموضع بجانب المشغل يستخدم تموضع المرساة CSS حيثما يدعم؛ وإلا فيتم توسيط النافذة في الطبقة
    العليا.
  </p>
</div>
