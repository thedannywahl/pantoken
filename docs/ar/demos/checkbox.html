<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
    <label class="instui-checkbox"><input type="checkbox" checked /> محدد</label>
    <label class="instui-checkbox"><input type="checkbox" /> غير محدد</label>
    <label class="instui-checkbox"><input type="checkbox" data-indeterminate /> غير محدد</label>
    <label class="instui-checkbox -size-sm"><input type="checkbox" checked /> صغير</label>
    <label class="instui-checkbox -invalid"><input type="checkbox" /> حالة الخطأ</label>
    <label class="instui-checkbox"><input type="checkbox" checked disabled /> معطّل</label>
    <label class="instui-checkbox -variant-toggle">
      <input type="checkbox" checked /> مفتاح التبديل
    </label>

    <div style="display: flex; gap: 24px; align-items: flex-start; margin-top: 4px">
      <label class="instui-checkbox -variant-toggle -label-placement-top">
        <input type="checkbox" checked /> تسمية في الأعلى
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-start">
        <input type="checkbox" /> تسمية في البداية
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-end">
        <input type="checkbox" checked /> التسمية في النهاية
      </label>
    </div>
  </div>
</div>
