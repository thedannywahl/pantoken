<div class="instui-card">
  <div class="button-demo">
    <section>
      <h4>الألوان</h4>
      <div class="row">
        <button class="instui-button">أساسي</button>
        <button class="instui-button -color-secondary">ثانوي</button>
        <button class="instui-button -color-tertiary">ثالثي</button>
        <button class="instui-button -color-success">نجاح</button>
        <button class="instui-button -color-danger">خطر</button>
      </div>
    </section>

    <section>
      <h4>AI</h4>
      <div class="row">
        <button class="instui-button -color-ai">AI أساسي</button>
        <button class="instui-button -color-ai-secondary">AI ثانوي</button>
      </div>
    </section>

    <section>
      <h4>أساسي معكوس (على سطح ملون)</h4>
      <div class="row on-brand">
        <button class="instui-button -color-primary-inverse">أساسي معكوس</button>
      </div>
    </section>

    <section>
      <h4>شفاف (بدون خلفية)</h4>
      <div class="row">
        <button class="instui-button -without-background">أساسي شفاف</button>
        <button class="instui-button -color-secondary -without-background">ثانوي شفاف</button>
      </div>
    </section>

    <section>
      <h4>كتلة (العرض الكامل)</h4>
      <button class="instui-button -display-block">زر كتلة</button>
    </section>

    <section>
      <h4>الأحجام</h4>
      <div class="row">
        <button class="instui-button -size-sm">صغير</button>
        <button class="instui-button">متوسط</button>
        <button class="instui-button -size-lg">كبير</button>
      </div>
    </section>

    <section>
      <h4>الأيقونات والأشكال</h4>
      <div class="row">
        <button class="instui-button">
          متابعة
          <span class="instui-icon -icon-arrow-right"></span>
        </button>
        <button class="instui-button -color-secondary">
          <span class="instui-icon -icon-download"></span>
          تنزيل
        </button>
        <button class="instui-button -color-secondary" id="star" aria-pressed="false">
          <span class="instui-icon -icon-star"></span>
          <span id="star-label">نجمة</span>
        </button>
        <!-- Icon-only: the glyph rides the button; name it with aria-label… -->
        <button class="instui-button -shape-square -icon-arrow-right" aria-label="Next"></button>
        <!-- …or with visually-hidden text (use one, not both). -->
        <button class="instui-button -shape-circle -icon-plus">
          <span class="instui-screen-reader-content">إضافة</span>
        </button>
      </div>
    </section>

    <section>
      <h4>مكثف وحالاته</h4>
      <div class="row">
        <button class="instui-button -condensed">مكثف</button>
        <button class="instui-button -condensed -size-sm">مكثف صغير</button>
        <button class="instui-button -toggle" id="toggle" aria-pressed="false">تبديل</button>
        <button class="instui-button" disabled>معطّل</button>
      </div>
    </section>
  </div>
</div>

<style>
  .button-demo {
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .button-demo .row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  /*
   * primary-inverse is meant for dark/brand surfaces, so pin this swatch to the brand colour's
   * light-scheme (dark navy) value in both site modes — otherwise the surface flips light in dark
   * mode and the white button disappears.
   */
  .button-demo .on-brand {
    color-scheme: light;
    padding: 12px;
    border-radius: var(--instui-border-radius-md, 6px);
    background: var(--instui-color-background-brand, #0770a3);
  }
</style>

<script>
  const star = document.getElementById("star");
  const starLabel = document.getElementById("star-label");
  let starred = false;
  star.addEventListener("click", () => {
    starred = !starred;
    starLabel.textContent = starred ? "Starred" : "Star";
    star.setAttribute("aria-pressed", String(starred));
  });

  const toggle = document.getElementById("toggle");
  toggle.addEventListener("click", () => {
    toggle.setAttribute(
      "aria-pressed",
      toggle.getAttribute("aria-pressed") === "true" ? "false" : "true",
    );
  });
</script>
