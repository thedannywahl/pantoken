<div class="instui-card">
  <div class="button-demo">
    <section>
      <h4>ألوان</h4>
      <div class="row">
        <button class="instui-button">أساسي</button>
        <button class="instui-button -color-secondary">ثانوي</button>
        <button class="instui-button -color-tertiary">ثالثي</button>
        <button class="instui-button -color-success">نجاح</button>
        <button class="instui-button -color-danger">خطر</button>
      </div>
    </section>

    <section>
      <h4>الذكاء الاصطناعي</h4>
      <div class="row">
        <button class="instui-button -color-ai">الذكاء الاصطناعي الأساسي</button>
        <button class="instui-button -color-ai-secondary">الذكاء الاصطناعي الثانوي</button>
      </div>
    </section>

    <section>
      <h4>On Color (text on colored background)</h4>
      <div class="row on-brand">
        <button class="instui-button -color-primary-inverse">أساسي معكوس</button>
        <button class="instui-button -color-primary -on-color">Primary on-color</button>
        <button class="instui-button -color-secondary -on-color">Secondary on-color</button>
      </div>
    </section>

    <section>
      <h4>شبح (بدون خلفية)</h4>
      <div class="row">
        <button class="instui-button -without-background">الشبح الأساسي</button>
        <button class="instui-button -color-secondary -without-background">شبح ثانوي</button>
      </div>
    </section>

    <section>
      <h4>كتلة (العرض الكامل)</h4>
      <button class="instui-button -display-block">زر الحظر</button>
    </section>

    <section>
      <h4>الأحجام</h4>
      <div class="row">
        <button class="instui-button -size-sm">صغير</button>
        <button class="instui-button">متوسط</button>
        <button class="instui-button -size-lg">كبير</button>
      </div>
    </section>

    <section>
      <h4>الأيقونات والأشكال</h4>
      <div class="row">
        <button class="instui-button">
          متابعة
          <span class="instui-icon -icon-arrow-right"></span>
        </button>
        <button class="instui-button -color-secondary">
          <span class="instui-icon -icon-download"></span>
          تنزيل
        </button>
        <button class="instui-button -color-secondary" id="star" aria-pressed="false">
          <span class="instui-icon -icon-star"></span>
          <span id="star-label">تمييز بنجمة</span>
        </button>
        <!-- Icon-only: the glyph rides the button; name it with aria-label… -->
        <button class="instui-button -shape-square -icon-arrow-right" aria-label="Next"></button>
        <!-- …or with visually-hidden text (use one, not both). -->
        <button class="instui-button -shape-circle -icon-plus">
          <span class="instui-screen-reader-content">إضافة</span>
        </button>
      </div>
    </section>

    <section>
      <h4>مضغوط والحالات</h4>
      <div class="row">
        <button class="instui-button -condensed">مكثف</button>
        <button class="instui-button -condensed -size-sm">مضغوط صغير</button>
        <button class="instui-button -toggle" id="toggle" aria-pressed="false">تبديل</button>
        <button class="instui-button" disabled>معطّل</button>
      </div>
    </section>
  </div>
</div>
