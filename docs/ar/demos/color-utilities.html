<div class="instui-card">
  <h2 class="instui-heading -level-h3">لون دلالي</h2>
  <p class="instui-text">
    <code>.--text-*</code> يصبغ النص، <code>.--bg-*</code> سطحًا، و <code>.--border-*</code> حدًا —
    كلٌ من رمز لون دلالي، لذا تظل التجاوزات على لوحة الألوان وتتبّع النمط.
  </p>
  <p class="instui-text --text-success --mb-2xs">نص-نجاح</p>
  <p class="instui-text --text-warning --mb-2xs">نص-تحذير</p>
  <p class="instui-text --text-error --mb-2xs">نص-خطأ</p>
  <p class="instui-text --text-info">نص-معلومات</p>

  <h3 class="instui-heading -level-h5 --mt-lg">الأسطح والحدود</h3>
  <p class="instui-text -color-secondary">
    الأسطح المزخرفة تقترن مع <code>.--text-on-color</code>.
  </p>
  <div style="display: flex; gap: var(--instui-spacing-space-sm); flex-wrap: wrap">
    <div
      class="instui-view --bg-accent-green --text-on-color --p-sm"
      style="border-radius: var(--instui-border-radius-md)"
    >
      <span class="instui-text --text-on-color">خلفية-نغمة-أخضر</span>
    </div>
    <div
      class="instui-view --bg-accent-plum --text-on-color --p-sm"
      style="border-radius: var(--instui-border-radius-md)"
    >
      <span class="instui-text --text-on-color">خلفية-نغمة-برقوق</span>
    </div>
    <div
      class="instui-view --border-strong --p-sm"
      style="border-width: 1px; border-style: solid; border-radius: var(--instui-border-radius-md)"
    >
      <span class="instui-text">حد-قوي</span>
    </div>
    <div
      class="instui-view --border-brand --p-sm"
      style="border-width: 1px; border-style: solid; border-radius: var(--instui-border-radius-md)"
    >
      <span class="instui-text">حد-العلامة</span>
    </div>
  </div>
</div>
