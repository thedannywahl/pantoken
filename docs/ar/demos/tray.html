<div class="instui-card">
  <!-- A tray as a native [popover]: it docks to an edge and opens in the top layer. -->
  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <button class="instui-button -color-secondary" popovertarget="tray-start">من البداية</button>
    <button class="instui-button -color-secondary" popovertarget="tray-end">من النهاية</button>
  </div>

  <div id="tray-start" popover class="instui-tray -size-sm">
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      "
    >
      <strong>فلاتر</strong>
      <button
        class="instui-close-button"
        popovertarget="tray-start"
        popovertargetaction="hide"
        aria-label="Close"
      ></button>
    </div>
    <p class="instui-text -size-sm">صينية تنزلق من حافة البداية وتملأ ارتفاع النافذة.</p>
  </div>

  <div id="tray-end" popover class="instui-tray -placement-end -size-sm">
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      "
    >
      <strong>تفاصيل</strong>
      <button
        class="instui-close-button"
        popovertarget="tray-end"
        popovertargetaction="hide"
        aria-label="Close"
      ></button>
    </div>
    <p class="instui-text -size-sm">هذه تثبت عند حافة النهاية. اضغط Esc أو انقر خارجها للإغلاق.</p>
  </div>
</div>
