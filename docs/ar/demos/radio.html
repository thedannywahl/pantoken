<div class="instui-card">
  <div class="radio-demo">
    <section>
      <h4>قياسي</h4>
      <div class="stack">
        <label class="instui-radio"><input type="radio" name="r" checked /> الخيار A</label>
        <label class="instui-radio"><input type="radio" name="r" /> الخيار B</label>
        <label class="instui-radio -size-lg"><input type="radio" name="r2" checked /> كبير</label>
        <label class="instui-radio"><input type="radio" name="r3" checked disabled /> معطّل</label>
      </div>
    </section>

    <section>
      <h4>أزرار التبديل (variant="toggle")</h4>
      <div class="group">
        <label class="instui-radio -variant-toggle"
          ><input type="radio" name="t" checked /> صغير</label
        >
        <label class="instui-radio -variant-toggle"><input type="radio" name="t" /> متوسط</label>
        <label class="instui-radio -variant-toggle"><input type="radio" name="t" /> كبير</label>
      </div>
    </section>

    <section>
      <h4>ألوان سياق التبديل</h4>
      <div class="group">
        <label class="instui-radio -variant-toggle -context-success"
          ><input type="radio" name="c1" checked /> نجاح</label
        >
        <label class="instui-radio -variant-toggle -context-danger"
          ><input type="radio" name="c2" checked /> خطر</label
        >
        <label class="instui-radio -variant-toggle -context-warning"
          ><input type="radio" name="c3" checked /> تحذير</label
        >
        <label class="instui-radio -variant-toggle -context-off"
          ><input type="radio" name="c4" checked /> إيقاف</label
        >
      </div>
    </section>
  </div>
</div>
