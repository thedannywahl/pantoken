<div class="instui-card">
  <h2 class="instui-heading -level-h3">فجوة</h2>
  <p class="instui-text">
    التخطيط المرن/الشبكة
    <code>gap</code> الفئات في مقياس التباعد، قصيرة (<code>--gap-sm</code>) أو طويل
    (<code>--gap-small</code>) تهجئة — قابلة للاستخدام بمفردها أو ربطها كسلسلة بأي مكوّن.
  </p>
  <div class="--display-flex --gap-sm">
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">gap-sm</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">واحد</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">اثنان</span>
    </div>
  </div>

  <h3 class="instui-heading -level-h5 --mt-lg">تهجئة طويلة</h3>
  <div class="--display-flex --gap-large">
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">gap-large</span>
    </div>
    <div class="instui-view --bg-accent-blue --text-on-color --p-sm">
      <span class="instui-text --text-on-color">واحد</span>
    </div>
  </div>
</div>
