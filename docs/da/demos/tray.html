<div class="instui-card">
  <!-- A tray as a native [popover]: it docks to an edge and opens in the top layer. -->
  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <button class="instui-button -color-secondary" popovertarget="tray-start">Fra start</button>
    <button class="instui-button -color-secondary" popovertarget="tray-end">Fra slut</button>
  </div>

  <div id="tray-start" popover class="instui-tray -size-sm">
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      "
    >
      <strong>Filtre</strong>
      <button
        class="instui-close-button"
        popovertarget="tray-start"
        popovertargetaction="hide"
        aria-label="Close"
      ></button>
    </div>
    <p class="instui-text -size-sm">
      Et panel glider ind fra startkanten og fylder visningsområdets højde.
    </p>
  </div>

  <div id="tray-end" popover class="instui-tray -placement-end -size-sm">
    <div
      style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      "
    >
      <strong>Detaljer</strong>
      <button
        class="instui-close-button"
        popovertarget="tray-end"
        popovertargetaction="hide"
        aria-label="Close"
      ></button>
    </div>
    <p class="instui-text -size-sm">
      Dette panel fastgøres til slutkanten. Tryk på Esc eller klik et andet sted for at lukke.
    </p>
  </div>
</div>
