<div class="alert-demo">
  <div class="alert-list">
    <div class="instui-alert -color-info instui-transition -fade-entered">
      Kan afvises med <code>transition="fade"</code> — Jeg toner ud, når den lukkes.
      <button class="instui-close-button -size-sm" aria-label="Close"></button>
    </div>
    <div class="instui-alert -color-success">
      Kan afvises med <code>transition="none"</code> — Jeg lukker med det samme.
      <button class="instui-close-button -size-sm" aria-label="Close"></button>
    </div>
    <div class="instui-alert -color-warning -without-shadow">
      Kan ikke afvises, og flad via <code>-without-shadow</code> (advarsler er som standard
      forhøjede)
    </div>
    <div class="instui-alert -color-info -icon-megaphone instui-transition -fade-entered">
      Et brugerdefineret ikon via <code>-icon-megaphone</code> klasse, holdt hvid på statuslinjen.
      <button class="instui-close-button -size-sm" aria-label="Close"></button>
    </div>
  </div>

  <button class="instui-button -color-secondary -size-sm" data-role="restore" disabled>
    Gendan alarmer
  </button>
</div>
