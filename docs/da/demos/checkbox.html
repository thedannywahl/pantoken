<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
    <label class="instui-checkbox"><input type="checkbox" checked /> Markeret</label>
    <label class="instui-checkbox"><input type="checkbox" /> Ikke markeret</label>
    <label class="instui-checkbox"><input type="checkbox" data-indeterminate /> Ubestemt</label>
    <label class="instui-checkbox -size-sm"><input type="checkbox" checked /> Lille</label>
    <label class="instui-checkbox -invalid"><input type="checkbox" /> Fejltilstand</label>
    <label class="instui-checkbox"><input type="checkbox" checked disabled /> Deaktiveret</label>
    <label class="instui-checkbox -variant-toggle">
      <input type="checkbox" checked /> Tænd/sluk-knap
    </label>

    <div style="display: flex; gap: 24px; align-items: flex-start; margin-top: 4px">
      <label class="instui-checkbox -variant-toggle -label-placement-top">
        <input type="checkbox" checked /> Etiket øverst
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-start">
        <input type="checkbox" /> Etiket i starten
      </label>
      <label class="instui-checkbox -variant-toggle -label-placement-end">
        <input type="checkbox" checked /> Etiket i slutningen
      </label>
    </div>
  </div>
</div>
