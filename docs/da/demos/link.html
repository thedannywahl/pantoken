<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-start">
    <a class="instui-link" href="#">Et stylet link</a>
    <a class="instui-link -size-lg" href="#">Et stort link</a>

    <!-- iconPlacement is just DOM order: an .instui-icon child before or after the text. -->
    <a class="instui-link" href="#">
      <span class="instui-icon -icon-download"></span>
      Ikon i starten
    </a>
    <a class="instui-link" href="#">
      Ikon i slutningen
      <span class="instui-icon -icon-arrow-right"></span>
    </a>

    <p class="instui-text">
      Læs den <a class="instui-link -inline" href="#">indlejrede dokumentation</a> for hele
      historien.
    </p>

    <a class="instui-link -unstyled" href="#">Uformateret link</a>
  </div>

  <!-- color="link-inverse": for links on a dark surface. -->
  <div
    style="
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      background: var(--instui-color-background-inverse);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    "
  >
    <a class="instui-link -color-inverse" href="#">Et link på en mørk baggrund</a>
    <a class="instui-link -color-inverse" href="#">
      <span class="instui-icon -icon-external-link"></span>
      Med et foranstillet ikon
    </a>
  </div>
</div>
