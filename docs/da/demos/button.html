<div class="instui-card">
  <div class="button-demo">
    <section>
      <h4>Farver</h4>
      <div class="row">
        <button class="instui-button">Primær</button>
        <button class="instui-button -color-secondary">Sekundær</button>
        <button class="instui-button -color-tertiary">Tertiær</button>
        <button class="instui-button -color-success">Succes</button>
        <button class="instui-button -color-danger">Fare</button>
      </div>
    </section>

    <section>
      <h4>AI</h4>
      <div class="row">
        <button class="instui-button -color-ai">AI primær</button>
        <button class="instui-button -color-ai-secondary">AI sekundær</button>
      </div>
    </section>

    <section>
      <h4>Primær invers (på en farvet overflade)</h4>
      <div class="row on-brand">
        <button class="instui-button -color-primary-inverse">Primær invers</button>
      </div>
    </section>

    <section>
      <h4>Ghost (ingen baggrund)</h4>
      <div class="row">
        <button class="instui-button -without-background">Primær ghost</button>
        <button class="instui-button -color-secondary -without-background">Sekundær ghost</button>
      </div>
    </section>

    <section>
      <h4>Blok (fuld bredde)</h4>
      <button class="instui-button -display-block">Blokknap</button>
    </section>

    <section>
      <h4>Størrelser</h4>
      <div class="row">
        <button class="instui-button -size-sm">Lille</button>
        <button class="instui-button">Mellem</button>
        <button class="instui-button -size-lg">Stor</button>
      </div>
    </section>

    <section>
      <h4>Ikoner og former</h4>
      <div class="row">
        <button class="instui-button">
          Fortsæt
          <span class="instui-icon -icon-arrow-right"></span>
        </button>
        <button class="instui-button -color-secondary">
          <span class="instui-icon -icon-download"></span>
          Download
        </button>
        <button class="instui-button -color-secondary" id="star" aria-pressed="false">
          <span class="instui-icon -icon-star"></span>
          <span id="star-label">Stjerne</span>
        </button>
        <!-- Icon-only: the glyph rides the button; name it with aria-label… -->
        <button class="instui-button -shape-square -icon-arrow-right" aria-label="Next"></button>
        <!-- …or with visually-hidden text (use one, not both). -->
        <button class="instui-button -shape-circle -icon-plus">
          <span class="instui-screen-reader-content">Tilføj</span>
        </button>
      </div>
    </section>

    <section>
      <h4>Kondenseret og tilstande</h4>
      <div class="row">
        <button class="instui-button -condensed">Kondenseret</button>
        <button class="instui-button -condensed -size-sm">Kondenseret lille</button>
        <button class="instui-button -toggle" id="toggle" aria-pressed="false">Slå til/fra</button>
        <button class="instui-button" disabled>Deaktiveret</button>
      </div>
    </section>
  </div>
</div>
