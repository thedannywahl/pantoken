<div class="instui-card">
  <div style="display: flex; flex-direction: column; gap: 28px">
    <!-- Toggle variant: the buttons connect into ONE segmented, single-select control (shared name) -->
    <fieldset class="instui-radio-input-group -variant-toggle">
      <legend>T-shirt-størrelse</legend>
      <label class="instui-radio -variant-toggle">
        <input type="radio" name="size" checked /> Lille
      </label>
      <label class="instui-radio -variant-toggle">
        <input type="radio" name="size" /> Mellem
      </label>
      <label class="instui-radio -variant-toggle"> <input type="radio" name="size" /> Stor </label>
    </fieldset>

    <!-- Simple variant (default): standard radios, stacked -->
    <fieldset class="instui-radio-input-group">
      <legend>Notifikationshyppighed</legend>
      <label class="instui-radio"><input type="radio" name="freq" checked /> Realtid</label>
      <label class="instui-radio"><input type="radio" name="freq" /> Daglig oversigt</label>
      <label class="instui-radio"><input type="radio" name="freq" /> Ugentlig oversigt</label>
    </fieldset>

    <!-- Simple variant, laid out in a row -->
    <fieldset class="instui-radio-input-group -layout-columns">
      <legend>Kontaktmetode</legend>
      <label class="instui-radio"><input type="radio" name="contact" checked /> E-mail</label>
      <label class="instui-radio"><input type="radio" name="contact" /> Telefon</label>
      <label class="instui-radio"><input type="radio" name="contact" /> Post</label>
    </fieldset>
  </div>
</div>
