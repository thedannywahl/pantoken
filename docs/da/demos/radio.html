<div class="instui-card">
  <div class="radio-demo">
    <section>
      <h4>Standard</h4>
      <div class="stack">
        <label class="instui-radio"><input type="radio" name="r" checked /> Mulighed A</label>
        <label class="instui-radio"><input type="radio" name="r" /> Mulighed B</label>
        <label class="instui-radio -size-lg"><input type="radio" name="r2" checked /> Stor</label>
        <label class="instui-radio"
          ><input type="radio" name="r3" checked disabled /> Deaktiveret</label
        >
      </div>
    </section>

    <section>
      <h4>Skifteknapper (variant="toggle")</h4>
      <div class="group">
        <label class="instui-radio -variant-toggle"
          ><input type="radio" name="t" checked /> Lille</label
        >
        <label class="instui-radio -variant-toggle"><input type="radio" name="t" /> Mellem</label>
        <label class="instui-radio -variant-toggle"><input type="radio" name="t" /> Stor</label>
      </div>
    </section>

    <section>
      <h4>Skift kontekstfarver</h4>
      <div class="group">
        <label class="instui-radio -variant-toggle -context-success"
          ><input type="radio" name="c1" checked /> Succes</label
        >
        <label class="instui-radio -variant-toggle -context-danger"
          ><input type="radio" name="c2" checked /> Fare</label
        >
        <label class="instui-radio -variant-toggle -context-warning"
          ><input type="radio" name="c3" checked /> Advarsel</label
        >
        <label class="instui-radio -variant-toggle -context-off"
          ><input type="radio" name="c4" checked /> Fra</label
        >
      </div>
    </section>
  </div>
</div>
