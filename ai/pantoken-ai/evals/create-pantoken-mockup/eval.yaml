name: create-pantoken-mockup-eval
description: Eval suite for standalone Pantoken browser mockups and sendable email HTML.
skill: create-pantoken-mockup
version: "1.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 0.7
    threshold: 0.8
    description: Did the skill choose the correct standalone artifact workflow?
  - name: efficiency
    weight: 0.3
    threshold: 0.7
    description: Did the skill avoid scaffolding an unnecessary application?
graders:
  - type: behavior
    name: token-budget
    config:
      max_tokens: 150000
tasks:
  - "tasks/*.yaml"
