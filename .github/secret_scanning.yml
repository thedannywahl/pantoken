# Entire agent-session transcripts, pushed as git objects under refs/entire/checkpoints/*.
#
# Why these are excluded: transcripts are dense with structural UUIDs (`id`, `parentId`,
# `toolCallId`). GitHub's *legacy* npm token detector matches a bare UUID whenever the keyword
# "npm" sits nearby — and in an npm monorepo that co-occurs on hundreds of lines per session.
# Every hit so far has been a false positive (verified: no credential pattern matches across any
# blob in the checkpoint refs), but push protection still rejects the refs and wedges Entire's
# push queue.
#
# Compensating control: Entire's own scanner (`redaction.goredact` in .entire/settings.json)
# redacts real credentials at capture time, before a transcript is ever written to a git object.
# See ASSURANCE.md.
#
# Scoped deliberately to Entire's transcript file names. The repository tracks no .jsonl or
# prompt.txt files of its own, so these patterns cannot mask a secret in first-party source.
paths-ignore:
  - "**/full.jsonl"
  - "**/transcript.jsonl"
  - "**/prompt.txt"
