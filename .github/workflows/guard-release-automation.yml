name: Guard release automation

# Reject PRs that impersonate the automated "Version Packages" release flow.
# The changesets action opens that PR from the changeset-release/main branch under
# github-actions[bot]; any other actor doing the same is either a mistake or a
# supply-chain attempt to land an unreviewed version bump.

on:
  workflow_call:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject unauthorized version-packages PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          RELEASE_ACTOR: ${{ vars.RELEASE_ACTOR || github.repository_owner }}
        run: |
          if [[ "$PR_HEAD" == changeset-release/* || "$PR_TITLE" == "chore: version packages"* ]]; then
            if [[ "$PR_HEAD" != "changeset-release/main" || "$PR_TITLE" != "chore: version packages" || "$PR_BASE" != "main" || "$PR_REPOSITORY" != "$GITHUB_REPOSITORY" || "$PR_ACTOR" != "$RELEASE_ACTOR" ]]; then
              echo "::error::Version PR identity does not match the authenticated release flow."
              exit 1
            fi
          fi
          if [[ "$PR_HEAD" == "maintenance/failed-updates" ]]; then
            echo "::error::Failed maintenance candidates must not merge through the automated release flow."
            exit 1
          fi
