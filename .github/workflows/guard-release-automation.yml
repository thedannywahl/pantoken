name: Guard release automation

# Reject PRs that impersonate the automated "Version Packages" release flow.
# The changesets action opens that PR from the changeset-release/main branch under
# github-actions[bot]; any other actor doing the same is either a mistake or a
# supply-chain attempt to land an unreviewed version bump.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unauthorized version-packages PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          # Pattern used by the changesets action for its automated Version PR.
          # Allow PRs from changeset-release/* branches — only the changesets action creates
          # PRs from these branches. Manual PRs from this branch are extremely unlikely since
          # the branch is push-protected and only updated by the release workflow.
          if echo "$PR_HEAD" | grep -qiE '^changeset-release/'; then
            # This PR is from the changesets action; allow it to proceed.
            exit 0
          fi

          # If it reaches here, it's NOT from the changeset-release branch.
          # Reject any PR titled 'chore: version packages' since only the changesets action
          # creates PRs with this exact title, and it only runs from the changeset-release branch.
          if echo "$PR_TITLE" | grep -qiE '^chore: version packages'; then
            echo "::error::PRs titled 'chore: version packages …' are created exclusively by the"
            echo "::error::automated release workflow. Close this PR and let the release flow"
            echo "::error::handle version bumps automatically."
            exit 1
          fi
