name: Guard release automation

# Reject PRs that impersonate the automated "Version Packages" release flow.
# The changesets action opens that PR from the changeset-release/main branch under
# github-actions[bot]; any other actor doing the same is either a mistake or a
# supply-chain attempt to land an unreviewed version bump.

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unauthorized version-packages PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          # Pattern used by the changesets action for its automated Version PR.
          if echo "$PR_TITLE" | grep -qiE '^chore: version packages' \
          || echo "$PR_HEAD"  | grep -qiE '^changeset-release/'; then
            # The release workflow labels the Version PR with 'automated-release' after creating it.
            # If this pattern matches but the label is missing, reject it — it's either a manual
            # attempt to impersonate the release flow or a genuine mistake.
            if ! echo "$PR_LABELS" | grep -q '"automated-release"'; then
              echo "::error::PRs titled 'chore: version packages …' or branched from"
              echo "::error::'changeset-release/*' must be created by the automated release workflow."
              echo "::error::Close this PR and let the release flow handle version bumps automatically."
              exit 1
            fi
          fi
