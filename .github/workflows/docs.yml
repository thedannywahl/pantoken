name: Deploy docs

# Publish the VitePress + TypeDoc site to Netlify.
#
# NOT GitHub Pages. The full-locale site is ~42k pages / ~92k files / ~1.7 GB, and GitHub caps a
# published Pages site at 1 GB with a 10-minute deploy timeout - the site outgrew the host. Netlify
# has no per-deploy file-count or size limit, only 54,000 files per single directory - which the site
# would blow past (~78k) if VitePress emitted every page chunk into one flat `assets/`. It doesn't:
# the site builds one locale at a time into `assets/<locale>/` (docs/scripts/build-locales.ts) and the
# results are merged. Netlify deploys are content-addressed, so after this first seed each release
# uploads only the files that actually changed.
#
# Diff-scoped: docs-only changes on main can deploy without waiting for a package release. Package
# releases still request a deploy through the Release workflow's `docs-deploy-request` artifact, and
# `workflow_dispatch` remains the manual escape hatch. The changed-page resolver picks a partial docs
# build when it can prove the affected pages, and falls back to the full-locale build when it cannot.
#
# The push-triggered path only watches paths that changeset-check.yml's `release_impact` filter does
# NOT cover (docs/**, l10n/docs.* catalogs, i18n.config.json, cssdoc.jsonc) - none of these require a
# changeset, so a PR touching only them merges straight to main with nothing pending in the changesets
# "Version Packages" PR. Package source (formats/components, formats/css, renderers/vitepress, …) is
# release-impacting and always carries a changeset, so it always lands on main again via that Version
# PR's merge, which is what the workflow_run path below deploys. Watching those paths here too would
# fire this push trigger on the first (feature-PR) merge and then again via workflow_run once the
# Version PR merges - the same content deployed twice for one release.
#
# This workflow builds the site itself: CI's `docs` job is an English-only breakage check that
# uploads nothing, and Netlify's own build system is never invoked (we ship a prebuilt directory).
#
# Required repository secrets: NETLIFY_AUTH_TOKEN (personal access token) and NETLIFY_SITE_ID.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - l10n/docs.*.pot
      - l10n/*/docs.*.po
      - i18n.config.json
      - cssdoc.jsonc
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Optional base ref for a diff-scoped manual deploy.
        required: false
        type: string
      full_build:
        description: Run the full docs build unless a base ref is provided.
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read # inspect the triggering Release run's artifacts

# Let a running deploy finish; don't cancel it mid-publish.
concurrency:
  group: docs-deploy
  cancel-in-progress: false

env:
  VP_TASK_CACHE: node_modules/.vite/task-cache
  VP_CACHE_KEY_PREFIX: vp-taskcache-

jobs:
  # A Release run reaches `completed` on both of its paths: opening/updating the Version PR, and
  # publishing. Only the publish path uploads `docs-deploy-request` (see release.yml), so its presence
  # is the "a release actually happened" signal. Direct pushes and manual dispatches don't need that
  # artifact gate.
  released:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
      trigger: ${{ steps.decide.outputs.trigger }}
      checkout_ref: ${{ steps.decide.outputs.checkout_ref }}
    steps:
      - name: Decide whether to deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SHA: ${{ github.sha }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "trigger=manual" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch; deploying."
            exit 0
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            # Matches the "chore: version packages" commit-message/pr-title release.yml sets for the
            # changesets Version PR, under squash, merge-commit, or rebase merge alike.
            if echo "$HEAD_COMMIT_MESSAGE" | grep -qi 'chore: version packages'; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "trigger=version-pr-merge" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=$SHA" >> "$GITHUB_OUTPUT"
              echo "Version Packages PR merge; deferring to the release workflow_run deploy."
              exit 0
            fi
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "trigger=docs-push" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "Docs-affecting push; deploying."
            exit 0
          fi
          # Security guard: Ensure workflow_run triggers originate from the same repository
          # to prevent untrusted code checkouts and secret exfiltration.
          if [ -n "$WORKFLOW_RUN_HEAD_REPO" ] && [ "$WORKFLOW_RUN_HEAD_REPO" != "$REPO" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "trigger=release" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "Untrusted workflow_run event from repo '$WORKFLOW_RUN_HEAD_REPO' (expected '$REPO'); skipping deploy."
            exit 0
          fi
          requested=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "docs-deploy-request")] | length')
          if [ "$requested" -gt 0 ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "trigger=release" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=${WORKFLOW_RUN_HEAD_SHA:-$SHA}" >> "$GITHUB_OUTPUT"
            echo "Release run $RUN_ID published; deploying."
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "trigger=release" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=$SHA" >> "$GITHUB_OUTPUT"
            echo "Release run $RUN_ID published nothing (Version PR path); skipping deploy."
          fi

  # One job: building and deploying are a single unit now. The old split existed only because
  # `actions/deploy-pages` had to run in the `github-pages` environment; Netlify's CLI has no such
  # constraint, and handing a ~1.7 GB directory between jobs via an artifact was pure overhead.
  deploy:
    needs: released
    if: needs.released.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    # The full-locale render is measured in hours, not minutes. Cap it well under the 6h job ceiling
    # so a wedged build fails visibly instead of burning a whole runner-day.
    timeout-minutes: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.released.outputs.checkout_ref }}
          fetch-depth: 0

      # ubuntu-latest has 16 GB of RAM and a 4 GB swapfile. When the docs build's peak working set
      # crosses physical memory the kernel OOM-killer takes out the runner agent, and the job reports
      # only "the runner has received a shutdown signal" - no V8 heap error, no stack. A large swapfile
      # turns that hard kill into (slow) forward progress, so a build that overshoots still lands.
      # /mnt is the runner's large scratch disk (~70 GB free).
      - name: Enlarge swap
        run: |
          set -euo pipefail
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          # Keep swap as a safety net rather than a first resort; the RSS should stay in RAM.
          sudo sysctl -w vm.swappiness=10
          free -h

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          cache: true
          run-install: true

      # Restore whatever CI already computed for this lockfile, so the package builds below are mostly
      # cache hits and only the docs generation plus the VitePress render are unavoidable work.
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-deploy-${{ github.run_id }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-

      # Partial builds render into `.vitepress/partial-dist` and overlay those files into the last
      # complete deploy directory. Only the locales owning a changed page get rebuilt, and the
      # partial run carries the previous `hashmap.json`/`sitemap.xml` forward (DOCS_BASE_DIST) so the
      # overlay can't replace a whole-site index with a handful of pages. Netlify receives a complete
      # `dist`, so unchanged live pages remain present while its content-addressed upload still sends
      # only changed files.
      - name: Restore docs dist cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: docs/.vitepress/dist
          key: docs-dist-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            docs-dist-${{ runner.os }}-

      # changed-pages.ts and docs/.vitepress/i18n.ts import several workspace packages' built output
      # directly (they run under plain node, not vp exec), so every dependency's dist must exist
      # before the resolver step below runs — not just the one that failed last time. Build the same
      # "@pantoken/docs..." dependency graph the later build steps use, so this is a cache hit there.
      - name: Build docs package dependencies
        run: vp run -F "@pantoken/docs..." build

      - name: Resolve changed docs
        id: changed_docs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER: ${{ needs.released.outputs.trigger }}
          PUSH_BASE: ${{ github.event.before }}
          INPUT_BASE: ${{ github.event.inputs.base || '' }}
          INPUT_FULL_BUILD: ${{ github.event.inputs.full_build || 'false' }}
        run: |
          set -euo pipefail
          pages_file="$RUNNER_TEMP/docs-changed-pages.json"
          echo "pages_file_abs=$pages_file" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_FULL_BUILD" == "true" && -z "$INPUT_BASE" ]]; then
            echo "scope=all" >> "$GITHUB_OUTPUT"
            echo "page_count=0" >> "$GITHUB_OUTPUT"
            echo "pages_file=" >> "$GITHUB_OUTPUT"
            echo "surfaces=" >> "$GITHUB_OUTPUT"
            echo "fallback_reason=Manual dispatch requested a full build." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$INPUT_BASE"
          if [[ -z "$base" && "$TRIGGER" == "docs-push" ]]; then
            base="$PUSH_BASE"
          fi
          if [[ -z "$base" && "$TRIGGER" == "release" ]]; then
            base=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          fi

          if [[ -z "$base" ]]; then
            echo "scope=all" >> "$GITHUB_OUTPUT"
            echo "page_count=0" >> "$GITHUB_OUTPUT"
            echo "pages_file=" >> "$GITHUB_OUTPUT"
            echo "surfaces=" >> "$GITHUB_OUTPUT"
            echo "fallback_reason=No diff base was available." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Diffing docs against $base"
          node docs/scripts/changed-pages.ts --base "$base" --out "$pages_file"

      # The full-locale build. `docs:api:locales` defaults to the deterministic `glossary` adapter, so
      # every locale's API tree is rendered from the committed `l10n/<locale>/docs.api.po` catalogs -
      # no AI adapter, no network, no secrets. An untranslated string falls back to English on its own.
      - name: Build docs (all locales)
        if: steps.changed_docs.outputs.scope != 'none'
        env:
          DOCS_BASE: /
          DOCS_HOSTNAME: https://pantoken.app/
          # Fewer pages SSR-rendered at once. VitePress defaults to 64 in flight, and each one holds
          # its rendered HTML and Vue SSR context alive; at ~39k pages that peak is what overshot the
          # runner's RAM. See the `buildConcurrency` note in docs/.vitepress/config.ts.
          DOCS_BUILD_CONCURRENCY: "12"
          # Sits below the 16 GB the runner actually has, so V8 collects under pressure instead of
          # letting the kernel kill the runner agent. Raised from 8192 once already; the memory that
          # made 8192 fail was mostly the local-search index, which no longer covers the translated
          # API mirrors.
          NODE_OPTIONS: --max-old-space-size=12288
          SCOPE: ${{ steps.changed_docs.outputs.scope }}
          PAGES_FILE: ${{ steps.changed_docs.outputs.pages_file_abs }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SCOPE" == "subset" && -f docs/.vitepress/dist/index.html ]]; then
            rm -rf docs/.vitepress/partial-dist
            vp run -F "@pantoken/docs..." build
            DOCS_CHANGED_PAGES_FILE="$PAGES_FILE" \
            DOCS_BASE_DIST="$PWD/docs/.vitepress/dist" \
              vp run @pantoken/docs#docs:build:deploy:partial
            rsync -a docs/.vitepress/partial-dist/ docs/.vitepress/dist/
            exit 0
          fi

          if [[ "$SCOPE" == "subset" ]]; then
            echo "No complete docs dist cache was restored; falling back to a full docs build."
          fi
          vp run -F "@pantoken/docs..." build
          vp run @pantoken/docs#docs:build:deploy

      # Netlify's only structural limit is 54,000 files in a single directory. The site is built one
      # locale at a time into its own `assets/<locale>/` (see docs/scripts/build-locales.ts) to stay
      # well under that — each locale lands near 1,800 files. Fail here, with the offending directory
      # named, rather than halfway through a multi-gigabyte upload.
      - name: Check site shape
        if: steps.changed_docs.outputs.scope != 'none'
        run: |
          set -euo pipefail
          cd docs/.vitepress/dist
          du -sh .
          echo "pages: $(find . -name '*.html' | wc -l)  files: $(find . -type f | wc -l)"
          # awk keeps the running max instead of `sort | head`: `head` closing the pipe early kills
          # `sort` with SIGPIPE, which `pipefail` turns into a failed step right before the deploy.
          worst=$(find . -type d -exec sh -c 'for d; do echo "$(ls -1U "$d" | wc -l) $d"; done' _ {} + \
            | awk '$1 > max { max = $1; line = $0 } END { print line }')
          echo "largest directory: $worst"
          if [ "${worst%% *}" -ge 54000 ]; then
            echo "::error::${worst#* } exceeds Netlify's 54,000-files-per-directory limit"
            exit 1
          fi

      # `--no-build` ships the directory as-is; Netlify never runs a build of its own. The CLI hashes
      # every file and uploads only the ones the site doesn't already have, so the first deploy is
      # slow and every later one is proportional to the diff. The CLI is pinned and fetched on demand
      # rather than vendored - it's a ~200 MB dependency that nothing else in the repo needs.
      - name: Deploy to Netlify
        id: netlify
        if: steps.changed_docs.outputs.scope != 'none'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail
          # Netlify CLI 16+ scans for a pnpm/yarn workspace and, from the repo root, refuses to guess
          # which of this monorepo's ~100 packages to deploy without --filter, even with
          # NETLIFY_SITE_ID set. --filter picks the (only) linked site among the workspace packages;
          # --dir still overrides where the deploy-ready files actually come from.
          vpx --package netlify-cli@27.5.2 netlify deploy \
            --filter "@pantoken/docs" \
            --prod \
            --no-build \
            --dir docs/.vitepress/dist \
            --message "$GITHUB_WORKFLOW $GITHUB_SHA" \
            --json > deploy.json
          echo "url=$(node -p 'require("./deploy.json").url')" >> "$GITHUB_OUTPUT"

      - name: Save docs dist cache
        if: steps.changed_docs.outputs.scope != 'none'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: docs/.vitepress/dist
          key: docs-dist-${{ runner.os }}-${{ github.sha }}
