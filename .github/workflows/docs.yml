name: Deploy docs

# Publish the VitePress + TypeDoc site to GitHub Pages.
# Enable Pages first: repo Settings -> Pages -> Build and deployment -> Source = GitHub Actions.
#
# Release-gated: this runs after the Release workflow and deploys only when that run actually
# published packages, which it signals with a `docs-deploy-request` artifact. So the live site tracks
# released versions rather than every green commit on main, and the full-locale build (~35k rendered
# pages) is paid once per release instead of once per push. `workflow_dispatch` is the manual escape
# hatch - a docs-only fix, or re-running a failed deploy - and skips the artifact check.
#
# This workflow builds the site itself: CI's `docs` job is an English-only breakage check that
# uploads nothing.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # inspect the triggering Release run's artifacts
  pages: write
  id-token: write

# Let a running deploy finish; don't cancel it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  VP_TASK_CACHE: node_modules/.vite/task-cache
  VP_CACHE_KEY_PREFIX: vp-taskcache-

jobs:
  # A Release run reaches `completed` on both of its paths: opening/updating the Version PR, and
  # publishing. Only the publish path uploads `docs-deploy-request` (see release.yml), so its presence
  # is the "a release actually happened" signal.
  released:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Decide whether to deploy
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch; deploying."
            exit 0
          fi
          requested=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "docs-deploy-request")] | length')
          if [ "$requested" -gt 0 ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "Release run $RUN_ID published; deploying."
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Release run $RUN_ID published nothing (Version PR path); skipping deploy."
          fi

  build:
    needs: released
    if: needs.released.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          cache: true
          run-install: true

      # Restore whatever CI already computed for this lockfile, so the package builds below are mostly
      # cache hits and only the docs generation plus the VitePress render are unavoidable work.
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-deploy-${{ github.run_id }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-

      # The full-locale build. `docs:api:locales` defaults to the deterministic `glossary` adapter, so
      # every locale's API tree is rendered from the committed `l10n/<locale>/docs.api.po` catalogs -
      # no AI adapter, no network, no secrets. An untranslated string falls back to English on its own.
      - name: Build docs (all locales)
        run: vp run -F "@pantoken/docs..." build && vp run @pantoken/docs#docs:build:deploy
        env:
          DOCS_BASE: /
          DOCS_HOSTNAME: https://pantoken.app/
          # vitepress-plugin-llms walks every locale's rendered pages; V8's auto-detected heap
          # ceiling isn't enough once all ~44 locales carry full content, so raise it explicitly.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Write custom domain file
        run: echo "pantoken.app" > docs/.vitepress/dist/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
