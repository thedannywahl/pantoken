name: Weekly maintenance

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      base: ${{ steps.refs.outputs.base }}
      proposal: ${{ steps.refs.outputs.proposal }}
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Run Renovate
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ secrets.RELEASE_PAT }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["^node scripts/release/capture-maintenance\\.ts$"]'
          RENOVATE_GIT_AUTHOR: "Pantoken Renovate <pantoken-renovate@users.noreply.github.com>"
      - name: Capture immutable proposal refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          proposal=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/renovate/weekly-maintenance" --jq '.object.sha' 2>/dev/null || true)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "proposal=${proposal:-$base}" >> "$GITHUB_OUTPUT"

  prepare:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout immutable trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.propose.outputs.base }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch proposal without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_SHA: ${{ needs.propose.outputs.proposal }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin "$PROPOSAL_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          run-install: true
      - name: Install host-check tools
        run: sudo apt-get update && sudo apt-get install --yes gettext php-cli php-xml php-mbstring composer ruby ruby-dev
      - name: Build trusted automation dependencies
        run: vp run @pantoken/model#build && vp run @pantoken/plugin-kit#build && vp run @pantoken/utils#build
      - name: Prepare passing changes and isolate failures
        env:
          BASE_SHA: ${{ needs.propose.outputs.base }}
          PROPOSAL_SHA: ${{ needs.propose.outputs.proposal }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: node scripts/release/weekly-maintenance.ts prepare "$BASE_SHA" "$PROPOSAL_SHA" "$RUNNER_TEMP/maintenance-result.json"
      - name: Upload validated handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: maintenance-result
          path: ${{ runner.temp }}/maintenance-result.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [propose, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted publication code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.propose.outputs.base }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
      - name: Download this run's validated handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: maintenance-result
          path: ${{ runner.temp }}/maintenance-handoff
      - name: Publish passing PR and failed-updates draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          BASE_SHA: ${{ needs.propose.outputs.base }}
          PROPOSAL_SHA: ${{ needs.propose.outputs.proposal }}
        run: node scripts/release/maintenance-publication.ts publish "$RUNNER_TEMP/maintenance-handoff/maintenance-result.json" "$BASE_SHA" "$PROPOSAL_SHA"
