name: Weekly maintenance

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      base: ${{ steps.refs.outputs.base }}
      proposal: ${{ steps.refs.outputs.proposal }}
    steps:
      - name: Checkout trusted automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Run Renovate
        uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          token: ${{ secrets.RELEASE_PAT }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_FORCE: >-
            ${{ github.event_name == 'workflow_dispatch' && '{"schedule":["at any time"]}' || '{}' }}
          RENOVATE_ALLOWED_COMMANDS: '["^node scripts/release/capture-maintenance\\.ts$"]'
          RENOVATE_GIT_AUTHOR: "Pantoken Renovate <pantoken-renovate@users.noreply.github.com>"
      - name: Capture immutable proposal refs
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          proposal=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/renovate/weekly-maintenance" --jq '.object.sha' 2>/dev/null || true)
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "proposal=${proposal:-$base}" >> "$GITHUB_OUTPUT"

  plan:
    needs: propose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PANTOKEN_MAINTENANCE_VALIDATION: "1"
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout immutable trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.propose.outputs.base }}
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch proposal without persisted credentials
        env:
          GH_TOKEN: ${{ github.token }}
          PROPOSAL_SHA: ${{ needs.propose.outputs.proposal }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin "$PROPOSAL_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          run-install: true
      - name: Build trusted automation dependencies
        run: vp run @pantoken/model#build && vp run @pantoken/plugin-kit#build && vp run @pantoken/utils#build
      - name: Plan immutable coupled groups
        id: plan
        env:
          BASE_SHA: ${{ needs.propose.outputs.base }}
          PROPOSAL_SHA: ${{ needs.propose.outputs.proposal }}
        run: node scripts/release/maintenance-validation.ts plan "$BASE_SHA" "$PROPOSAL_SHA" "$RUNNER_TEMP/maintenance-plan"
      - name: Upload immutable plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: maintenance-plan-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maintenance-plan/plan.json
          if-no-files-found: error
          retention-days: 7

  baseline:
    needs: [propose, plan]
    uses: ./.github/workflows/maintenance-validation.yml
    with:
      stage: baseline
      base: ${{ needs.propose.outputs.base }}
      proposal: ${{ needs.propose.outputs.proposal }}

  candidates:
    needs: [propose, plan, baseline]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/maintenance-validation.yml
    with:
      stage: candidate
      group: ${{ matrix.id }}
      base: ${{ needs.propose.outputs.base }}
      proposal: ${{ needs.propose.outputs.proposal }}

  integrate:
    needs: [propose, candidates]
    uses: ./.github/workflows/maintenance-validation.yml
    with:
      stage: integrate
      base: ${{ needs.propose.outputs.base }}
      proposal: ${{ needs.propose.outputs.proposal }}

  publish:
    needs: [propose, integrate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted publication code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.propose.outputs.base }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Download this run's validated handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.integrate.outputs.artifact }}
          path: ${{ runner.temp }}/maintenance-handoff
      - name: Publish passing PR and failed-updates draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          BASE_SHA: ${{ needs.propose.outputs.base }}
          PROPOSAL_SHA: ${{ needs.propose.outputs.proposal }}
        run: node scripts/release/maintenance-publication.ts publish "$RUNNER_TEMP/maintenance-handoff/maintenance-result.json" "$BASE_SHA" "$PROPOSAL_SHA"
