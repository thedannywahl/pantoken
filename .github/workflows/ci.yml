name: CI

# The PR gate: build, typecheck, test, lint, and the publish/provenance checks — everything `ready`
# plus the gates covers, split into parallel jobs. Runs on every PR and on pushes to main so a
# regression is caught before merge, not at docs-deploy or release-tag time.

on:
  pull_request:
  push:
    branches: [main]
  # `workflow_dispatch` lets CodSpeed trigger a backtest run to seed baseline data for the
  # `benchmarks` job; jobs gated on `pull_request` simply no-op on a manual run.
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight PR runs; let main runs finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # vp's task cache stores task OUTPUTS as .tar.zst tarballs, so a cache hit re-materializes the
  # gitignored generated dirs. The `build` job warms it; downstream jobs restore and replay
  # `vp run -r build` as a fast cache-extract instead of a cold rebuild.
  VP_TASK_CACHE: node_modules/.vite/task-cache
  VP_CACHE_KEY_PREFIX: vp-taskcache-

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Restore/save vp task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Build all packages
        run: vp run -r build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  typecheck:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Typecheck
        run: vp check

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Test all packages
        run: vp run -r test

  # Continuous performance testing for the transform pipeline, run inside the CI gate so it reuses the
  # `build` job's cached task outputs instead of rebuilding from scratch. Advisory only — a CodSpeed
  # regression must never block merge, so failures here are swallowed with `continue-on-error`.
  benchmarks:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Run benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5
        with:
          mode: simulation
          run: vp exec vitest bench --run --config vite.bench.config.ts

  coverage:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Resolve changed packages
        id: changed
        if: github.event_name == 'pull_request'
        env:
          CHANGED_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/release/changed-packages.ts
      # Workspace-group flags let Codecov carry forward coverage for groups not tested on a scoped PR.
      - name: Compute upload flags
        id: flags
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PATHS: ${{ steps.changed.outputs.paths }}
        run: |
          if [[ "${EVENT}" != "pull_request" ]]; then
            echo "value=packages,formats,renderers,bundlers,platforms,plugins,tools,scripts,docs,ai,design" >> "$GITHUB_OUTPUT"
          else
            flags=$(printf '%s\n' "${PATHS//,/$'\n'}" | cut -d'/' -f1 | sort -u | paste -sd,)
            echo "value=${flags}" >> "$GITHUB_OUTPUT"
          fi
      # Full coverage on push to main (keeps Codecov's project baseline accurate); on PRs, only the
      # changed packages + dependents run, so we don't test the whole workspace every time. The 85%
      # threshold floor (vite.config.ts) fails the run either way.
      - name: Coverage (full on main, scoped to changed packages on PRs)
        id: cov
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SCOPE: ${{ steps.changed.outputs.scope }}
          PATHS: ${{ steps.changed.outputs.paths }}
        run: |
          if [[ "${EVENT}" != "pull_request" ]]; then
            vp run -r build
            echo "ran=true" >> "$GITHUB_OUTPUT"
            vp test --coverage --reporter=verbose --reporter=junit --outputFile.junit=junit.xml
            exit 0
          fi
          if [[ "${SCOPE}" == "none" ]]; then
            echo "No publishable packages changed; skipping coverage."
            echo "ran=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          vp run -r build
          echo "ran=true" >> "$GITHUB_OUTPUT"
          if [[ "${SCOPE}" == "all" ]]; then
            vp test --coverage --reporter=verbose --reporter=junit --outputFile.junit=junit.xml
          else
            IFS=',' read -ra dirs <<< "${PATHS}"
            echo "scoped coverage: ${dirs[*]}"
            vp test "${dirs[@]}" --coverage --reporter=verbose --reporter=junit --outputFile.junit=junit.xml
          fi
      - name: Upload coverage to Codecov
        if: steps.cov.outputs.ran == 'true'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: ${{ steps.flags.outputs.value }}
          override_pr: ${{ github.event.pull_request.number }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.cov.outputs.ran == 'true' }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          report_type: test_results
          override_pr: ${{ github.event.pull_request.number }}
          fail_ci_if_error: false

  fallow:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history so hotspot churn (git log) and the audit base ref are available.
          fetch-depth: 0
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      # The same policy on PRs and main: dead-code = error, health floored at grade B, dead-code
      # regression vs the committed baseline, duplication advisory. We deliberately don't use
      # `fallow audit` here — it bundles duplication into its verdict with no opt-out, which would
      # gate duplication against policy. fallow analysis is sub-second, so running it over the whole
      # workspace (rather than scoping to changed files) costs nothing beyond the build that already ran.
      # fallow is a code-quality tool, not a security scanner — its findings are advisory (the gate
      # above enforces policy) and don't belong in the security code-scanning dashboard, which gates
      # PR checks on any error-level result. CodeQL owns code scanning; fallow findings surface in
      # this job's log and are enforced by `health:fallow`.
      - name: Fallow gate (dead-code error, grade-B health floor, dupes advisory)
        run: vp run health:fallow

  lint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Lint CSS
        run: vp run lint:css
      - name: Lint JS
        run: vp run lint:js
      - name: Lint TSDoc
        run: vp run lint:tsdoc
      - name: Validate generated output
        run: vp run validate:generated:only
      - name: Lint Markdown
        run: vp run lint:markdown

  publint:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history so the changed-packages diff can reach the PR base / previous push.
          fetch-depth: 0
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Resolve changed packages
        id: changed
        env:
          CHANGED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/release/changed-packages.ts
      - name: Build and publint (scoped to changed packages)
        shell: bash
        env:
          SCOPE: ${{ steps.changed.outputs.scope }}
          PACKAGES: ${{ steps.changed.outputs.packages }}
        run: |
          if [[ "${SCOPE}" == "none" ]]; then
            echo "No publishable packages changed; skipping publint."
            exit 0
          fi
          if [[ "${SCOPE}" == "all" ]]; then
            vp run -r build
            vp run gate:publint
            exit $?
          fi
          # publint only inspects the scoped packages, so build just their dependency closure ("...").
          build_filters=(); check_filters=()
          IFS=',' read -ra pkgs <<< "${PACKAGES}"
          for p in "${pkgs[@]}"; do
            [[ -n "${p}" ]] || continue
            build_filters+=("-F" "${p}...")
            check_filters+=("-F" "${p}")
          done
          echo "publint scoped to: ${pkgs[*]}"
          vp run "${build_filters[@]}" build
          vp exec "${check_filters[@]}" publint

  attw:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history so the changed-packages diff can reach the PR base / previous push.
          fetch-depth: 0
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Resolve changed packages
        id: changed
        env:
          CHANGED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/release/changed-packages.ts
      - name: Build and attw (scoped to changed packages)
        shell: bash
        env:
          SCOPE: ${{ steps.changed.outputs.scope }}
          PACKAGES: ${{ steps.changed.outputs.packages }}
        run: |
          if [[ "${SCOPE}" == "none" ]]; then
            echo "No publishable packages changed; skipping attw."
            exit 0
          fi
          if [[ "${SCOPE}" == "all" ]]; then
            vp run -r build
            vp run gate:attw
            exit $?
          fi
          # attw only packs the scoped packages, so build just their dependency closure ("...").
          build_filters=(); check_filters=()
          IFS=',' read -ra pkgs <<< "${PACKAGES}"
          for p in "${pkgs[@]}"; do
            [[ -n "${p}" ]] || continue
            build_filters+=("-F" "${p}...")
            check_filters+=("-F" "${p}")
          done
          echo "attw scoped to: ${pkgs[*]}"
          vp run "${build_filters[@]}" build
          vp exec "${check_filters[@]}" attw --pack --profile strict --no-emoji --ignore-rules no-resolution cjs-resolves-to-esm

  repository:
    # Pure manifest read — no build needed. Catches a missing repository.url (which breaks npm OIDC
    # provenance) on the PR instead of at release.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Check repository metadata
        run: vp run gate:repository

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Lint PR commit messages
        run: vp exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  # Detect changes that could shift the vendored token IR, so the upstream-drift gate runs only when a
  # bump (or the pipeline itself) changed. Runs on both events so `upstream-drift`'s `needs` resolves.
  upstream-changes:
    runs-on: ubuntu-latest
    outputs:
      upstream: ${{ steps.filter.outputs.upstream }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect upstream-pin changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            upstream:
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'formats/tokens/**'
              - 'tools/upstream-diff/**'

  # The upstream-drift gate: fails when the committed baseline doesn't match the freshly built token IR,
  # forcing a bump to be blessed (`vp run upgrade:bless`) in the same PR. The classified report is printed
  # to the job log and uploaded as an artifact so every token/icon delta is visible on the PR.
  upstream-drift:
    needs: [build, upstream-changes]
    if: needs.upstream-changes.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Check upstream drift
        run: vp run upgrade:check
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-drift-report
          path: tools/upstream-diff/generated
          retention-days: 7

  # Detect docs-relevant changes so PRs only pay for the docs build when the site could change. Runs on
  # both events (never skipped) so the `docs` job's `needs` is always satisfied.
  docs-changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect docs-relevant changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'packages/**'
              - 'formats/**'
              - 'platforms/**'
              - 'renderers/**'
              - 'plugins/**'
              - 'design/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  # Detect changes that could introduce translation drift in the i18n bundle caches.
  i18n-changes:
    runs-on: ubuntu-latest
    outputs:
      i18n: ${{ steps.filter.outputs.i18n }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect i18n-relevant changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            i18n:
              - 'packages/i18n/**'
              - 'renderers/web-components/src/lib/strings.ts'

  # Verify all Canvas locale caches are current relative to the English source strings.
  # AI translation is never wired here — fill drift locally with `vp run i18n:translate`.
  i18n-drift:
    needs: [build, i18n-changes]
    if: needs.i18n-changes.outputs.i18n == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Check i18n bundle drift
        run: vp run i18n:check:drift

  # Build the site as part of CI, so:
  #  - PRs get the exact deploy command run — a broken build OR a stale translation cache
  #    (check-locale-drift) blocks the PR instead of only surfacing in the post-merge Deploy docs run.
  #  - main pushes upload the built site as `docs-site`, which the Deploy docs workflow publishes
  #    directly (no rebuild).
  # Gated on docs-relevant changes with the same path set the Deploy docs `changes` job uses, so the
  # artifact is uploaded exactly when a deploy will look for it.
  docs:
    needs: [build, docs-changes]
    if: needs.docs-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Build docs (locale parity + drift + VitePress build)
        run: vp run @pantoken/docs#docs:build
        env:
          DOCS_BASE: /
          DOCS_HOSTNAME: https://pantoken.iywahl.com/
      # On main, hand the built site to the Deploy docs workflow (workflow_run) so it publishes without
      # rebuilding. The CNAME is baked in here so the downloaded artifact is deploy-ready as-is.
      - name: Add custom domain file
        if: github.ref == 'refs/heads/main'
        run: echo "pantoken.iywahl.com" > docs/.vitepress/dist/CNAME
      - name: Upload built docs site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-site
          path: docs/.vitepress/dist
          retention-days: 1

  # The single required status check for branch protection. It `needs` every other job here and runs
  # `if: always()`, so it resolves only once they all do — and it fails if any of them failed or was
  # cancelled, while treating a *skipped* job (docs when nothing docs-relevant changed, commitlint on a
  # push) as fine. Requiring just this one name means the protection rule never needs editing when jobs
  # are added or renamed, and conditional jobs can't park a PR at "Expected — waiting for status." Pairs
  # with `changeset-gate` in changeset-check.yml; both are required, so a PR merges only when every check
  # across both workflows is green — which is what lets `gh pr merge --auto` wait for real.
  ci-gate:
    needs:
      [
        build,
        typecheck,
        test,
        coverage,
        fallow,
        lint,
        publint,
        attw,
        repository,
        commitlint,
        upstream-changes,
        upstream-drift,
        docs-changes,
        docs,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no CI job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required CI job failed or was cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1
