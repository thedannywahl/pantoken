            webpack:
              - 'bundlers/webpack/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/css/**'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  webpack_compatibility:
    needs: [build, webpack_changes]
    if: needs.webpack_changes.outputs.webpack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify webpack releases
        run: vp run @pantoken/webpack#check:compatibility

  tailwind_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tailwind: ${{ steps.filter.outputs.tailwind }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect Tailwind support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            tailwind:
              - 'bundlers/tailwind/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  tailwind_compatibility:
    needs: [build, tailwind_changes]
    if: needs.tailwind_changes.outputs.tailwind == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify Tailwind releases
        run: vp run @pantoken/tailwind#check:compatibility

  bootstrap_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bootstrap: ${{ steps.filter.outputs.bootstrap }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect Bootstrap support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            bootstrap:
              - 'renderers/bootstrap/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/components/**'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  bootstrap_compatibility:
    needs: [build, bootstrap_changes]
    if: needs.bootstrap_changes.outputs.bootstrap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify Bootstrap releases
        run: vp run @pantoken/bootstrap#check:compatibility

  rehype_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rehype: ${{ steps.filter.outputs.rehype }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect rehype support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rehype:
              - 'renderers/rehype/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/icons/**'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  rehype_compatibility:
    needs: [build, rehype_changes]
    if: needs.rehype_changes.outputs.rehype == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify rehype releases
        run: vp run @pantoken/rehype#check:compatibility

  # Detect docs-relevant changes so PRs only pay for the docs build when the site could change. Runs on
  # both events (never skipped) so the `docs` job's `needs` is always satisfied.
  docs-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect docs-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'packages/**'
              - 'formats/**'
              - 'platforms/**'
              - 'renderers/**'
              - 'plugins/**'
              - 'design/**'
              - 'tools/translation-adapters/**'
              - 'i18n.config.json'
              - 'l10n/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  # Detect changes that could introduce translation drift in the catalogs. `i18n.config.json`
  # and the shared policy module are in the path set too — editing what blocks a merge has to re-run
  # the gate that reads it.
  i18n-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      i18n: ${{ steps.filter.outputs.i18n }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect i18n-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            i18n:
              - 'renderers/web-components/src/i18n.json'
              - 'packages/scaffold/src/i18n.json'
              - 'ai/pantoken-ai/src/i18n.json'
              - 'l10n/**'
              - 'tools/translation-adapters/**'
              - 'tools/i18n-engine/**'
              - 'i18n.config.json'

  # Verify all Canvas locale caches are current relative to the English source strings.
  #
  # `i18n.config.json` requires complete catalogs for every locale, including generated API prose.
  #
  # AI translation is never wired here — fill drift locally with `vp run i18n:translate`.
  i18n-drift:
    needs: [build, i18n-changes]
    if: needs.i18n-changes.outputs.i18n == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install --yes gettext
      - name: Check all translation drift
        run: vp run gate:i18n

  # Build the site as a breakage check: English API + VitePress, no localized API trees. The deploy
  # build is a separate, release-gated thing (see docs.yml), so nothing here is published — this job
  # exists to catch a broken config, a bad generator, or a dead link before it reaches a release.
  # Gated on docs-relevant changes.
  docs:
    needs: [build, docs-changes]
    if: needs.docs-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Build docs (English API + VitePress)
        run: vp run @pantoken/docs#docs:build
        env:
          DOCS_BASE: /
          DOCS_HOSTNAME: https://pantoken.app/
          # Root-locale-only build, so the ceiling is pure headroom for TypeDoc's API tree plus the
          # VitePress SSR pass. Kept explicit because V8's auto-detected ceiling is sized off the
          # runner's RAM, which varies.
          NODE_OPTIONS: --max-old-space-size=8192

  # The single required status check for branch protection. It `needs` every other job here and runs
  # `if: always()`, so it resolves only once they all do — and it fails if any of them failed or was
  # cancelled, while treating a *skipped* job (docs when nothing docs-relevant changed, commitlint on a
  # push) as fine. Requiring just this one name means the protection rule never needs editing when jobs
  # are added or renamed, and conditional jobs can't park a PR at "Expected — waiting for status." Pairs
  # with `changeset-gate` in changeset-check.yml; both are required, so a PR merges only when every check
  # across both workflows is green — which is what lets `gh pr merge --auto` wait for real.
  ci-gate:
    needs:
      [
        build,
        typecheck,
        coverage,
        fallow,
        lint,
        package-gates,
        meta,
        upstream-changes,
        upstream-drift,
        docs-changes,
        docs,
        i18n-changes,
        i18n-drift,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify no CI job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required CI job failed or was cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1
