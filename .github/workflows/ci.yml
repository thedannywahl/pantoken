name: CI

# The PR gate: build, typecheck, test, lint, and the publish/provenance checks — everything `ready`
# plus the gates covers, split into parallel jobs. Runs on every PR and on pushes to main so a
# regression is caught before merge, not at docs-deploy or release-tag time.

on:
  pull_request:
  push:
    branches: [main]
  # `workflow_dispatch` lets CodSpeed trigger a backtest run to seed baseline data for the
  # `benchmarks` job; jobs gated on `pull_request` simply no-op on a manual run.
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight PR runs; let main runs finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job carries `timeout-minutes`. release.yml's gate waits on this workflow's conclusion with a
# 1-hour deadline, so a job left on the 6-hour default can hang the release even when it's advisory.
# Values are ~2.5x observed runtime — these catch hangs, not slow-but-working jobs.

env:
  # vp's task cache stores task OUTPUTS as .tar.zst tarballs, so a cache hit re-materializes the
  # gitignored generated dirs. The `build` job warms it; downstream jobs restore and replay
  # `vp run -r build` as a fast cache-extract instead of a cold rebuild.
  #
  # Key shape: `<prefix><os>-<hash(pnpm-lock.yaml, vite.config.ts)>-<run_id>-<run_attempt>`.
  #
  # The hash segment has to be in the SAVE key, not just the restore-keys — a restore-key only ever
  # matches a key some run actually wrote. Omitting it made `<prefix><os>-<hash>-` dead config that
  # could never match, silently degrading every restore to the broad `<prefix><os>-` fallback (i.e.
  # "the newest cache from any lockfile").
  #
  # The run_id/run_attempt tail keeps each attempt's key unique, because GH Actions cache keys are
  # immutable: a sha-based key can never be resaved by a rerun, so a `build` job whose auto-tracked
  # output snapshot was incomplete for that attempt would pin every downstream job (and every rerun of
  # the same commit) to that broken tarball forever. A fresh key per attempt means a rerun always
  # saves, and downstream jobs in this attempt exact-match this attempt's own build.
  VP_TASK_CACHE: node_modules/.vite/task-cache
  VP_CACHE_KEY_PREFIX: vp-taskcache-

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore/save vp task cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Build all packages
        run: vp run -r build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  typecheck:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Generate docs theme curve
        run: node docs/scripts/site-themes.ts
      - name: Typecheck
        run: vp check

  foundation_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      foundation: ${{ steps.filter.outputs.foundation }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect Foundation support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            foundation:
              - 'renderers/foundation/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/tokens/**'
              - 'formats/components/**'
              - 'packages/utils/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  foundation_compatibility:
    needs: [build, foundation_changes]
    if: needs.foundation_changes.outputs.foundation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify Foundation releases
        run: vp run @pantoken/foundation#check:compatibility

  docusaurus_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docusaurus: ${{ steps.filter.outputs.docusaurus }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect Docusaurus support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docusaurus:
              - 'renderers/docusaurus/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  docusaurus_compatibility:
    needs: [build, docusaurus_changes]
    if: needs.docusaurus_changes.outputs.docusaurus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify Docusaurus releases
        run: vp run @pantoken/docusaurus#check:compatibility

  astro_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      astro: ${{ steps.filter.outputs.astro }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect Astro support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            astro:
              - 'renderers/astro/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/css/**'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  astro_compatibility:
    needs: [build, astro_changes]
    if: needs.astro_changes.outputs.astro == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify Astro and Starlight releases
        run: vp run @pantoken/astro#check:compatibility

  react_markdown_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      react_markdown: ${{ steps.filter.outputs.react_markdown }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect react-markdown support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            react_markdown:
              - 'renderers/react-markdown/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/components/**'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  react_markdown_compatibility:
    needs: [build, react_markdown_changes]
    if: needs.react_markdown_changes.outputs.react_markdown == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify react-markdown SSR
        run: vp run @pantoken/react-markdown#check:compatibility

  vue_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      vue: ${{ steps.filter.outputs.vue }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect Vue support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            vue:
              - 'renderers/vue/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  vue_compatibility:
    needs: [build, vue_changes]
    if: needs.vue_changes.outputs.vue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify Vue releases
        run: vp run @pantoken/vue#check:compatibility

  react_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      react: ${{ steps.filter.outputs.react }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect React support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            react:
              - 'renderers/react/**'
              - 'renderers/web-components/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  react_compatibility:
    needs: [build, react_changes]
    if: needs.react_changes.outputs.react == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify React server rendering
        run: vp run @pantoken/react#check:compatibility

  next_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      next: ${{ steps.filter.outputs.next }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect Next support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            next:
              - 'bundlers/next/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/css/**'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  next_compatibility:
    needs: [build, next_changes]
    if: needs.next_changes.outputs.next == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify Next releases
        run: vp run @pantoken/next#check:compatibility

  mui_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mui: ${{ steps.filter.outputs.mui }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect MUI support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            mui:
              - 'renderers/mui/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/tokens/**'
              - 'packages/utils/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  mui_compatibility:
    needs: [build, mui_changes]
    if: needs.mui_changes.outputs.mui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify MUI releases
        run: vp run @pantoken/mui#check:compatibility

  # Continuous performance testing for the transform pipeline, run inside the CI gate so it reuses the
  # `build` job's cached task outputs instead of rebuilding from scratch. Advisory only — a CodSpeed
  # regression must never block merge, so failures here are swallowed with `continue-on-error`.
  # The extra step-level timeout is for the CodSpeed runner specifically: it can wedge on its
  # instrument-hook handshake, and `continue-on-error` doesn't help a hang.
  benchmarks:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5.2.1
        timeout-minutes: 12
        with:
          mode: walltime
          run: VP_NODE_VERSION=22.18.0 vp test --run --config vite.bench.config.ts

  coverage:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install --yes gettext
      - name: Materialize generated output
        run: vp run -r build
      # The locale-drift tests skip themselves with a warning when `docs/api` isn't generated, so this
      # step is what makes them actually assert.
      - name: Generate English API documentation
        run: vp run @pantoken/docs#docs:api:en
      # One full run with coverage, on PRs and main alike. v8 instruments in-flight, so this costs
      # barely more than a bare `vp test` — and a second, uninstrumented full run in its own job cost a
      # whole extra checkout, install, and build. The 85% threshold floor (vite.config.ts) fails the run.
      - name: Test all packages with coverage
        run: vp test --coverage --reporter=verbose --reporter=junit --outputFile.junit=junit.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: packages,formats,renderers,bundlers,platforms,plugins,tools,scripts,docs,ai,design
          override_pr: ${{ github.event.pull_request.number }}
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          report_type: test_results
          override_pr: ${{ github.event.pull_request.number }}
          fail_ci_if_error: false

  fallow:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history so hotspot churn (git log) and the audit base ref are available.
          fetch-depth: 0
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      # The same policy on PRs and main: dead-code = error, health floored at grade B, dead-code
      # regression vs the committed baseline, duplication thresholded. We deliberately don't use
      # `fallow audit` here — it bundles duplication into its verdict with no opt-out, which would
      # gate duplication against policy. fallow analysis is sub-second, so running it over the whole
      # workspace (rather than scoping to changed files) costs nothing beyond the build that already ran.
      # fallow is a code-quality tool, not a security scanner — its findings are advisory (the gate
      # above enforces policy) and don't belong in the security code-scanning dashboard, which gates
      # PR checks on any error-level result. CodeQL owns code scanning; fallow findings surface in
      # this job's log and are enforced by `health:fallow`.
      - name: Fallow gate (dead-code error, grade-B health floor, dupes thresholded)
        run: vp run health:fallow
      - name: Generate health badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vp exec fallow health --format badge > fallow-badge.svg
      - name: Prepare health badge publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mkdir -p badge-publish && cp fallow-badge.svg badge-publish/fallow-badge.svg
      - name: Publish health badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: badge-publish
          publish_branch: badges
          keep_files: true

  lint:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Lint CSS
        run: vp run lint:css
      - name: Lint CSSDoc
        run: vp run lint:cssdoc
      - name: Validate generated output
        run: vp run validate:generated:only
      - name: Lint Markdown
        run: vp run lint:markdown

  # publint and attw inspect the same scoped set of changed packages and need the same dependency-closure
  # build to do it, so they share one job instead of each paying a checkout, install, and scoped build.
  # attw still runs when publint fails, so a PR gets both verdicts from a single pass.
  package-gates:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history so the changed-packages diff can reach the PR base / previous push.
          fetch-depth: 0
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Resolve changed packages
        id: changed
        env:
          CHANGED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/release/changed-packages.ts
      # Both gates only inspect the scoped packages, so build just their dependency closure ("...").
      - name: Build changed packages
        id: scoped_build
        if: steps.changed.outputs.scope != 'none'
        shell: bash
        env:
          SCOPE: ${{ steps.changed.outputs.scope }}
          PACKAGES: ${{ steps.changed.outputs.packages }}
        run: |
          if [[ "${SCOPE}" == "all" ]]; then
            vp run -r build
            exit $?
          fi
          build_filters=()
          IFS=',' read -ra pkgs <<< "${PACKAGES}"
          for p in "${pkgs[@]}"; do
            [[ -n "${p}" ]] || continue
            build_filters+=("-F" "${p}...")
          done
          echo "package gates scoped to: ${pkgs[*]}"
          vp run "${build_filters[@]}" build
      - name: publint
        if: steps.changed.outputs.scope != 'none'
        shell: bash
        env:
          SCOPE: ${{ steps.changed.outputs.scope }}
          PACKAGES: ${{ steps.changed.outputs.packages }}
        run: |
          if [[ "${SCOPE}" == "all" ]]; then
            vp run gate:publint
            exit $?
          fi
          check_filters=()
          IFS=',' read -ra pkgs <<< "${PACKAGES}"
          for p in "${pkgs[@]}"; do
            [[ -n "${p}" ]] || continue
            check_filters+=("-F" "${p}")
          done
          vp exec "${check_filters[@]}" publint
      - name: attw
        if: ${{ !cancelled() && steps.scoped_build.outcome == 'success' }}
        shell: bash
        env:
          SCOPE: ${{ steps.changed.outputs.scope }}
          PACKAGES: ${{ steps.changed.outputs.packages }}
        run: |
          if [[ "${SCOPE}" == "all" ]]; then
            vp run gate:attw
            exit $?
          fi
          check_filters=()
          IFS=',' read -ra pkgs <<< "${PACKAGES}"
          for p in "${pkgs[@]}"; do
            [[ -n "${p}" ]] || continue
            check_filters+=("-F" "${p}")
          done
          vp exec "${check_filters[@]}" attw --pack --profile strict --no-emoji --ignore-rules no-resolution cjs-resolves-to-esm

  # Three build-free checks in one job: each is seconds of work that would otherwise pay its own
  # checkout, install, and runner startup.
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # Full history so the commit-range checks below can reach the PR base.
          fetch-depth: 0
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      # Pure manifest read. Catches a missing repository.url (which breaks npm OIDC provenance) on the
      # PR instead of at release.
      - name: Check repository metadata
        run: vp run gate:repository
      - name: Lint PR commit messages
        if: github.event_name == 'pull_request'
        run: vp exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose
      # Advisory only: warns when a PR commit has no linked Entire checkpoint (missing
      # `Entire-Checkpoint` trailer), but never blocks merge — hence the step-level `continue-on-error`,
      # which must stay on the step so the blocking checks above still gate the job. Pure git: no Entire
      # CLI, login, or agent credentials needed, since linkage is recorded as a commit trailer at commit
      # time.
      - name: Check for Entire-Checkpoint trailers
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          missing=0
          for sha in $(git log --no-merges --format=%H "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            author_email="$(git log -1 --format=%ae "$sha")"
            # Skip bot-authored commits (e.g. release automation) — they never go through an agent session.
            case "$author_email" in
              *"[bot]"*@users.noreply.github.com) continue ;;
            esac
            if ! git log -1 --format=%B "$sha" | grep -q '^Entire-Checkpoint:'; then
              echo "::warning::Commit ${sha} has no linked Entire checkpoint (missing Entire-Checkpoint trailer)"
              missing=$((missing + 1))
            fi
          done
          echo "${missing} commit(s) without an Entire checkpoint link. Advisory only; does not block merge."

  # Detect changes that could shift the vendored token IR, so the upstream-drift gate runs only when a
  # bump (or the pipeline itself) changed. Runs on both events so `upstream-drift`'s `needs` resolves.
  upstream-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      upstream: ${{ steps.filter.outputs.upstream }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect upstream-pin changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            upstream:
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'formats/tokens/**'
              - 'tools/upstream-diff/**'

  # The upstream-drift gate: fails when the committed baseline doesn't match the freshly built token IR,
  # forcing a bump to be blessed (`vp run upgrade:bless`) in the same PR. The classified report is printed
  # to the job log and uploaded as an artifact so every token/icon delta is visible on the PR.
  upstream-drift:
    needs: [build, upstream-changes]
    if: needs.upstream-changes.outputs.upstream == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Check upstream drift
        run: vp run upgrade:check
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-drift-report
          path: tools/upstream-diff/generated
          retention-days: 7

  wordpress-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wordpress: ${{ steps.filter.outputs.wordpress }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect WordPress support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            wordpress:
              - 'platforms/wordpress/**'
              - 'scripts/release/target-compatibility.json'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'

  wordpress-compatibility:
    needs: [build, wordpress-changes]
    if: needs.wordpress-changes.outputs.wordpress == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify WordPress releases
        run: vp run @pantoken/wordpress#check:compatibility

  swift_native_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift_native: ${{ steps.filter.outputs.swift_native }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect native Swift changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            swift_native:
              - 'platforms/swift/**'
              - 'packages/cli/**'
              - 'packages/core/**'
              - 'packages/utils/**'
              - 'tools/sd-config/**'
              - 'formats/tokens/**'
              - 'mise.toml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  swift_native_compatibility:
    needs: swift_native_changes
    if: needs.swift_native_changes.outputs.swift_native == 'true'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Install mise
        run: brew install mise
      - name: Verify generated Swift against iOS Simulator SDK
        run: mise run verify:swift:host

  postcss-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      postcss: ${{ steps.filter.outputs.postcss }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect PostCSS support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            postcss:
              - 'bundlers/postcss/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/css/**'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  postcss-compatibility:
    needs: [build, postcss-changes]
    if: needs.postcss-changes.outputs.postcss == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify PostCSS releases
        run: vp run @pantoken/postcss#check:compatibility

  markdown_it_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      markdown_it: ${{ steps.filter.outputs.markdown_it }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect markdown-it support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            markdown_it:
              - 'renderers/markdown-it/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/icons/**'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  markdown_it_compatibility:
    needs: [build, markdown_it_changes]
    if: needs.markdown_it_changes.outputs.markdown_it == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify markdown-it releases
        run: vp run @pantoken/markdown-it#check:compatibility

  vite_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      vite: ${{ steps.filter.outputs.vite }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect Vite support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            vite:
              - 'bundlers/vite/**'
              - 'scripts/quality/with-target-version.ts'
              - 'scripts/release/target-compatibility.json'
              - 'formats/css/**'
              - 'formats/tokens/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'

  vite_compatibility:
    needs: [build, vite_changes]
    if: needs.vite_changes.outputs.vite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          cache: true
          run-install: true
      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-
      - name: Materialize generated output
        run: vp run -r build
      - name: Verify Vite releases
        run: vp run @pantoken/vite#check:compatibility

  webpack_changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      webpack: ${{ steps.filter.outputs.webpack }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect webpack support changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
