name: Renovate merge policy

on:
  pull_request_target:
    branches: [main]
    types:
      [
        opened,
        reopened,
        synchronize,
        edited,
        ready_for_review,
        converted_to_draft,
        auto_merge_enabled,
        auto_merge_disabled,
      ]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read

concurrency:
  group: renovate-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    name: Evaluate trusted automation policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted base policy only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
      - name: Publish policy status on the current PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_ACTOR: ${{ vars.RELEASE_ACTOR || github.repository_owner }}
          RENOVATE_ACTOR: ${{ vars.RENOVATE_ACTOR || vars.RELEASE_ACTOR || github.repository_owner }}
        run: node scripts/release/renovate-policy.ts
