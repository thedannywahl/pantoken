name: CodSpeed

# Continuous performance testing for the transform pipeline: `buildTokens`, the reference resolver,
# and the CSS/SCSS/DTCG emitters. Runs on every PR and on pushes to main so a performance regression
# is caught alongside the correctness gates in ci.yml, not after a release.

on:
  pull_request:
  push:
    branches: [main]
  # `workflow_dispatch` lets CodSpeed trigger a backtest run to seed baseline data.
  workflow_dispatch:

permissions:
  contents: read
  # OpenID Connect authentication with CodSpeed — no token secret needed.
  id-token: write

# Supersede in-flight PR runs; let main runs finish.
concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VP_TASK_CACHE: node_modules/.vite/task-cache
  VP_CACHE_KEY_PREFIX: vp-taskcache-

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          cache: true
          run-install: true

      - name: Restore vp task cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.VP_TASK_CACHE }}
          key: ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'vite.config.ts') }}-
            ${{ env.VP_CACHE_KEY_PREFIX }}${{ runner.os }}-

      # The benchmarks import package sources directly, but those sources import `@pantoken/*`
      # specifiers that resolve to built `dist/` (and `@pantoken/tokens`' generated JSON), so the
      # workspace has to be built first — same as the `test` job in ci.yml.
      - name: Materialize generated output
        run: vp run -r build

      - name: Run benchmarks
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5
        with:
          mode: simulation
          run: vp exec vitest bench --run --config vite.bench.config.ts
