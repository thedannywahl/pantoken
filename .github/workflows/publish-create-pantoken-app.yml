name: Publish create-pantoken-app skill

# Keep the create.pantoken.app static site (a separate GitHub repo, checked out here as the
# ai/create-pantoken-app-site submodule) in sync with the canonical skill source whenever it
# changes on main. See docs/conventions/build-and-docs.md for the manual equivalent and the
# rationale for index.html/404.html/SKILL.md.
#
# Requires a repo secret CREATE_PANTOKEN_APP_PAT: a personal access token (fine-grained, scoped to
# just the thedannywahl/create-pantoken-app repo, Contents: Read and write) with push rights there —
# the default GITHUB_TOKEN can't push to a different repo. If the secret isn't set, this job skips
# the push (and warns) instead of failing, so it's safe to merge before the secret is configured.

on:
  push:
    branches: [main]
    paths:
      - "ai/pantoken-ai/skills/create-pantoken-app/**"
  workflow_dispatch:

permissions:
  contents: write # push the submodule pointer bump branch
  pull-requests: write # open the protected-branch PR for the pointer bump

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true

      - name: Check for publish token
        id: check-token
        run: |
          if [ -z "${{ secrets.CREATE_PANTOKEN_APP_PAT }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CREATE_PANTOKEN_APP_PAT secret is not set; skipping create.pantoken.app publish. See docs/conventions/build-and-docs.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Plain `node` script (no external deps), so no vp/pnpm setup needed.
      - name: Stage the skill into the submodule
        if: steps.check-token.outputs.configured == 'true'
        run: node docs/scripts/stage-create-pantoken-app-domain.ts

      - name: Commit and push if changed
        if: steps.check-token.outputs.configured == 'true'
        working-directory: ai/create-pantoken-app-site
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.CREATE_PANTOKEN_APP_PAT }}@github.com/thedannywahl/create-pantoken-app.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: sync create-pantoken-app skill from pantoken@${{ github.sha }}"
            git push origin HEAD:main
          fi

      # Advance the submodule pointer through a PR, because main is protected. The release PAT
      # makes the PR a user-authored event so its required checks run automatically.
      - name: Open submodule pointer bump PR
        if: steps.check-token.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          branch="automation/create-pantoken-app-sync-${{ github.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/create-pantoken-app-site
          if git diff --cached --quiet; then
            echo "Submodule pointer unchanged."
          else
            git commit -m "chore: bump create-pantoken-app-site submodule [skip ci]"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$branch"
            existing_pr=$(gh pr list --repo "${{ github.repository }}" --base main --head "$branch" --state open --json number --jq '.[0].number')
            if [ -n "$existing_pr" ]; then
              echo "Updated existing submodule pointer PR #$existing_pr."
            else
              gh pr create --repo "${{ github.repository }}" --base main --head "$branch" --title "chore: bump create-pantoken-app-site submodule" --body "Automated pointer update for create.pantoken.app from pantoken@${{ github.sha }}."
            fi
          fi
