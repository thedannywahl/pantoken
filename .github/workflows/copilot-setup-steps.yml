name: "Copilot Setup Steps"

# GitHub's Copilot coding agent runs the `copilot-setup-steps` job directly when it provisions its
# environment — that invocation does not depend on these triggers. The triggers exist only to validate
# the file when it changes, which `pull_request` covers. A `push` trigger is deliberately omitted: for
# tag pushes GitHub ignores `paths` filters, so a bare `push: paths:` fired this workflow once per
# package release tag (~30x per release) doing nothing but `vp --version`.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

# Restrict the default token to read-only; the job overrides what it needs.
permissions: read-all

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          cache: true
          run-install: true
      - name: Verify Vite+
        run: vp --version
