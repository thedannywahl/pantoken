name: Reconcile compatibility issues

on:
  push:
    branches: [main]
    paths: [".renovate/verified-targets.json"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
      - name: Close exact-version reviews verified on main
        run: |
          if [ -f .renovate/verified-targets.json ]; then
            node scripts/release/maintenance-publication.ts reconcile .renovate/verified-targets.json
          fi
        env:
          GH_TOKEN: ${{ github.token }}
