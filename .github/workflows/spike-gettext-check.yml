name: Spike - gettext toolchain check

# Phase 0 item 1 spike (.claude/plans/localization-engine.md): confirms whether msgmerge/msgfmt
# ship preinstalled on the ubuntu-latest runner image, so the localization engine knows whether it
# can rely on them or must `apt-get install gettext` explicitly. Manual dispatch only — not part of
# the PR/main gate.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check for msgmerge/msgfmt
        run: |
          echo "OS: $(lsb_release -ds 2>/dev/null || cat /etc/os-release | head -1)"
          if command -v msgmerge >/dev/null 2>&1 && command -v msgfmt >/dev/null 2>&1; then
            echo "PREINSTALLED=true" >> "$GITHUB_ENV"
            msgmerge --version | head -1
            msgfmt --version | head -1
          else
            echo "PREINSTALLED=false" >> "$GITHUB_ENV"
            echo "msgmerge/msgfmt not found on PATH"
          fi
      - name: Report
        run: echo "gettext preinstalled on ubuntu-latest -> $PREINSTALLED"
