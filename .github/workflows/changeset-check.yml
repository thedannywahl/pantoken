name: Changeset check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-release-impact:
    runs-on: ubuntu-latest
    outputs:
      release_impact: ${{ steps.filter.outputs.release_impact }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect release-impacting changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            release_impact:
              - 'packages/**'
              - 'formats/**'
              - 'platforms/**'
              - 'renderers/**'
              - 'bundlers/**'
              - 'design/**'
              - 'plugins/**'
              - 'ai/**'
              - 'tools/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'

  require-changeset:
    needs: detect-release-impact
    if: needs.detect-release-impact.outputs.release_impact == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # A pull_request checkout lands in detached HEAD with no local `main`, so `changeset status`
      # can't find where HEAD diverged from the base branch. Materialize it as a local ref.
      - name: Make base branch available for changeset diff
        run: git fetch --no-tags origin +refs/heads/${{ github.base_ref }}:refs/heads/${{ github.base_ref }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          cache: true
          run-install: true

      # `release:coverage` is the gate: it fails when a changed publishable package has no pending
      # changeset bumping it. It supersedes a bare `changeset status` — it ignores private packages and
      # dev-only package.json changes (scripts/devDependencies), which `changeset status` would wrongly
      # flag. Skipped on the changesets bot's "Version Packages" PR (it bumps package.json and deletes
      # the changesets, which the check would otherwise trip); skipping the step keeps this required
      # check green there.
      - name: Require a changeset for each changed publishable package
        if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
        env:
          CHANGESET_BASE: ${{ github.base_ref }}
        run: vp run release:coverage

  docs-and-internal-only:
    needs: detect-release-impact
    if: needs.detect-release-impact.outputs.release_impact != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip changeset requirement
        run: |
          echo "No release-impacting files changed."
          echo "Changeset requirement is skipped for docs/internal-only PRs."

  # The required status check for this workflow (mirror of `ci-gate` in ci.yml). `require-changeset` and
  # `docs-and-internal-only` are mutually exclusive — exactly one runs per PR and the other is skipped —
  # so neither can be required directly without parking PRs at "Expected." This gate `needs` all three
  # jobs, runs `if: always()`, and fails only on a real failure/cancellation, treating skips as fine.
  # Requiring `ci-gate` and `changeset-gate` together is what makes `gh pr merge --auto` wait until every
  # check across both workflows is green.
  changeset-gate:
    needs: [detect-release-impact, require-changeset, docs-and-internal-only]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no changeset-check job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required changeset-check job failed or was cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1
