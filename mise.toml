# mise coordinates native toolchains and checks; Vite+ manages the JS runtime and workspace.
# Swift comes from Xcode on macOS. Add pinned native backends when other targets come online.

[tasks.build]
description = "Build every JS package"
run = "vp run -r build"

[tasks.test]
description = "Test every JS package"
run = "vp test"

[tasks.check]
description = "Lint + type-check every JS package"
run = "vp check"

[tasks.ready]
description = "The single pass/fail gate (build + check + test)"
run = "vp run ready:all"

[tasks."scaffold:swift"]
description = "Generate a SwiftPM token package at SWIFT_PACKAGE_OUT"
depends = ["build"]
run = '''
set -eu
: "${SWIFT_PACKAGE_OUT:?Set SWIFT_PACKAGE_OUT to the desired SwiftPM package directory}"
node packages/cli/bin/pantoken.mjs generate swift --out "$SWIFT_PACKAGE_OUT" --class PanTokens
'''

[tasks."verify:swift:syntax"]
description = "Generate Swift tokens and parse them with the local Swift compiler (not a host build)"
depends = ["build"]
run = '''
set -eu
native_tmp="$(mktemp -d "${TMPDIR:-/tmp}/pantoken-swift.XXXXXX")"
trap 'rm -r -- "$native_tmp"' EXIT
node packages/cli/bin/pantoken.mjs generate swift --out "$native_tmp/DesignTokens" --class PanTokens
swiftc -frontend -parse "$native_tmp/DesignTokens/Sources/PanTokens/Tokens.swift"
'''

[tasks."verify:swift:host"]
description = "Compile generated Swift against the iOS Simulator SDK with full Xcode"
depends = ["build"]
run = '''
set -eu
if [ ! -d /Applications/Xcode.app/Contents/Developer ]; then
	printf '%s\n' 'Full Xcode is required for UIKit; use verify:swift:syntax for a portable check.' >&2
	exit 1
fi
native_tmp="$(mktemp -d "${TMPDIR:-/tmp}/pantoken-swift.XXXXXX")"
trap 'rm -r -- "$native_tmp"' EXIT
node packages/cli/bin/pantoken.mjs generate swift --out "$native_tmp/DesignTokens" --class PanTokens
ios_sdk="$(DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcrun --sdk iphonesimulator --show-sdk-path)"
DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer xcrun --sdk iphonesimulator swiftc \
	-parse-as-library -emit-module -module-name PanTokens \
	-target arm64-apple-ios15.0-simulator -sdk "$ios_sdk" \
	-emit-module-path "$native_tmp/PanTokens.swiftmodule" \
	"$native_tmp/DesignTokens/Sources/PanTokens/Tokens.swift"
'''

# Add native adapter checks here as each target gains a real compiler or host fixture.
[tasks."verify:native"]
description = "Run portable native syntax checks; host checks require their target SDKs"
depends = ["verify:swift:syntax"]
run = "true"
