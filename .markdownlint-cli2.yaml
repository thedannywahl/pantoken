ignores:
  - node_modules
  - "**/node_modules"
  - dist
  - "**/dist"
  - coverage
  - "**/coverage"
  - "**/style.css"
  # Per-package generated/ dirs (gitignored, reproduced by build); includes the upstream-diff report.
  - "**/generated"
  - "**/generated/**"
  # Generated TypeDoc API reference, including per-locale copies (rebuilt by `docs:build`); not
  # hand-edited.
  - "docs/api"
  - "docs/api/**"
  - "docs/*/api"
  - "docs/*/api/**"
  # Local-only agent notes and migration seeds; ignored by Git and never published.
  - "docs/internal"
  - "docs/internal/**"
  # Tool-managed by `vp config`; not hand-edited.
  - ".github/copilot-instructions.md"
  # Changesets are frontmatter-then-prose tooling artifacts (no leading H1); managed by `changeset`.
  - ".changeset/*.md"
  # Generated by the Entire CLI and Skills CLI (`entire agent add`, `skills add`); not hand-edited, so
  # upstream's own markdown conventions apply instead of this repo's.
  - ".agents/skills"
  - ".agents/skills/**"
  - "agent/skills"
  - "agent/skills/**"
  - ".claude"
  - ".claude/**"
